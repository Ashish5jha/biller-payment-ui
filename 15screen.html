<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    
    <!-- Fonts and Icons from Google CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <style>
        /* ------------------------- */
        /* --- DESIGN SYSTEM & SETUP --- */
        /* ------------------------- */
        :root {
            /* Branding Colors */
            --primary-color: #007a3d;
            --text-primary-color: #212121;
            --text-secondary-color: #6b6b6b;
            --background-color: #ffffff;
            --gradient-background: linear-gradient(135deg, #fdfcff, #f8f4f9, #f1f0ff);
            --error-color: #d32f2f;

            /* Typography */
            --font-family-primary: 'Poppins', sans-serif;
            --font-family-secondary: 'Open Sans', sans-serif;
            --h3-font-size: 28px;
            --body-font-size: 16px;

            /* Layout & Components */
            --card-border-radius: 8px;
            --card-padding: 32px;
            --button-border-radius: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-family-secondary);
            background: var(--gradient-background);
            color: var(--text-primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }
        
        /* ------------------------- */
        /* --- LOGIN CARD LAYOUT --- */
        /* ------------------------- */
        .login-card {
            background: var(--background-color);
            border-radius: var(--card-border-radius);
            padding: var(--card-padding);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .logo {
            max-height: 50px; /* Example size */
            margin-bottom: 24px;
        }

        .login-card h3 {
            font-family: var(--font-family-primary);
            font-size: var(--h3-font-size);
            font-weight: 700;
            margin-bottom: 24px;
        }
        
        /* ------------------------- */
        /* --- FORM FIELDS --- */
        /* ------------------------- */
        .form-field {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }
        .form-field .icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary-color);
        }
        .form-field input {
            width: 100%;
            padding: 12px 12px 12px 48px; /* Padding for icon */
            border: 1px solid #ccc;
            border-radius: var(--button-border-radius);
            font-size: var(--body-font-size);
            font-family: var(--font-family-secondary);
        }
        .form-field input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .form-field .toggle-visibility {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 12px;
            color: var(--text-secondary-color);
        }
        
        .form-options {
            display: flex;
            justify-content: flex-end;
            margin-top: -12px;
            margin-bottom: 24px;
        }
        .forgot-password-link {
            font-size: 14px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        .forgot-password-link:hover {
            text-decoration: underline;
        }

        /* ------------------------- */
        /* --- BUTTON & ERRORS --- */
        /* ------------------------- */
        .btn-signin {
            width: 100%;
            border: none;
            border-radius: var(--button-border-radius);
            padding: 12px 24px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.3s;
            background-color: var(--primary-color);
            color: var(--background-color);
        }
        .btn-signin:disabled {
            background-color: #bdbdbd;
            cursor: not-allowed;
        }
        
        .error-message {
            color: var(--error-color);
            font-size: 14px;
            margin-top: 16px;
            text-align: center;
            display: none; /* Hidden by default */
        }
        .error-message.visible {
            display: block;
        }
        
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Add your logo here if you have one -->
        <!-- <img src="your-logo.png" alt="Supreme Ventures Logo" class="logo"> -->
        <h3>Sign in to your account</h3>

        <form id="login-form">
            <div class="form-field">
                <span class="material-symbols-outlined icon">mail</span>
                <input type="email" id="email" placeholder="Email Address" required>
            </div>
            <div class="form-field">
                 <span class="material-symbols-outlined icon">lock</span>
                <input type="password" id="password" placeholder="Password" required>
                <button type="button" id="toggle-password" class="toggle-visibility" title="Toggle password visibility">
                    <span class="material-symbols-outlined">visibility_off</span>
                </button>
            </div>

            <div class="form-options">
                <a href="#" class="forgot-password-link">Forgot Password?</a>
            </div>

            <button type="submit" id="signin-btn" class="btn-signin" disabled>Sign In</button>

            <p id="error-message" class="error-message">Invalid email or password.</p>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // --- MOCK USER DATABASE ---
            // In a real app, this would come from your localStorage `users` key,
            // but for a clean login demo, we define them here.
            const MOCK_USERS = {
                'admin@svl.com': { password: 'password123', role: 'SVL Admin' },
                'biller@kingstonmart.com': { password: 'password123', role: 'Biller' }
            };

            // --- DOM REFERENCES ---
            const loginForm = document.getElementById('login-form');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const signInBtn = document.getElementById('signin-btn');
            const togglePasswordBtn = document.getElementById('toggle-password');
            const errorMessage = document.getElementById('error-message');

            // --- FUNCTIONALITY ---
            const checkFormValidity = () => {
                const isEmailValid = emailInput.value.trim() !== '' && emailInput.checkValidity();
                const isPasswordValid = passwordInput.value.trim() !== '';
                signInBtn.disabled = !(isEmailValid && isPasswordValid);
            };

            const togglePasswordVisibility = () => {
                const icon = togglePasswordBtn.querySelector('.material-symbols-outlined');
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    icon.textContent = 'visibility';
                } else {
                    passwordInput.type = 'password';
                    icon.textContent = 'visibility_off';
                }
            };
            
            const handleLogin = (e) => {
                e.preventDefault();
                errorMessage.classList.remove('visible');

                const email = emailInput.value.toLowerCase();
                const password = passwordInput.value;
                const user = MOCK_USERS[email];

                // Simulate an API call delay
                setTimeout(() => {
                    if (user && user.password === password) {
                        // --- SUCCESS ---
                        // 1. Save logged-in user info to localStorage for other screens to use
                        const loggedInUser = { email: email, role: user.role };
                        localStorage.setItem('loggedInUser', JSON.stringify(loggedInUser));

                        // 2. Redirect based on role
                        alert(`Login successful! Welcome, ${user.role}. Redirecting...`);
                        if (user.role === 'SVL Admin') {
                            window.location.href = 'biller-management-dashboard.html'; // Or Screen 2.1
                        } else {
                            window.location.href = 'biller-dashboard.html'; // Or Screen 3.1
                        }
                    } else {
                        // --- FAILURE ---
                        errorMessage.classList.add('visible');
                    }
                }, 500); // 0.5 second delay
            };

            // --- EVENT LISTENERS ---
            emailInput.addEventListener('input', checkFormValidity);
            passwordInput.addEventListener('input', checkFormValidity);
            togglePasswordBtn.addEventListener('click', togglePasswordVisibility);
            loginForm.addEventListener('submit', handleLogin);
        });
    </script>
</body>
</html>
