<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management</title>
    
    <!-- Fonts and Icons from Google CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <style>
        /* ------------------------- */
        /* --- DESIGN SYSTEM & SETUP --- */
        /* ------------------------- */
        :root {
            /* Branding Colors */
            --primary-color: #007a3d;
            --text-primary-color: #212121;
            --text-secondary-color: #6b6b6b;
            --background-color: #ffffff;
            --body-bg-color: #f7f7f7;
            --border-color: #eeeeee;
            --warning-color: #d32f2f;

            /* Typography */
            --font-family-primary: 'Poppins', sans-serif;
            --font-family-secondary: 'Open Sans', sans-serif;
            --h3-font-size: 28px;
            --body-font-size: 16px;

            /* Layout & Components */
            --max-width: 1200px;
            --card-border-radius: 8px;
            --card-box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            --card-padding: 24px;
            --button-border-radius: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-family-secondary);
            background-color: var(--body-bg-color);
            color: var(--text-primary-color);
            line-height: 1.6;
            font-size: var(--body-font-size);
            padding: 32px 16px;
        }
        
        /* ------------------------- */
        /* --- MAIN LAYOUT & CARD --- */
        /* ------------------------- */
        .main-container {
            max-width: var(--max-width);
            margin: 0 auto;
            background: var(--background-color);
            border-radius: var(--card-border-radius);
            box-shadow: var(--card-box-shadow);
            padding: var(--card-padding);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .card-header h3 {
            font-family: var(--font-family-primary);
            font-size: var(--h3-font-size);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-header h3 .material-symbols-outlined {
            color: var(--primary-color);
            font-size: 32px;
        }
        
        .header-actions {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        /* ------------------------- */
        /* --- BUTTONS --- */
        /* ------------------------- */
        .btn {
            border: none;
            border-radius: var(--button-border-radius);
            padding: 12px 24px;
            font-family: var(--font-family-secondary);
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.3s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background-color: var(--primary-color); color: var(--background-color); }
        .btn-danger { background-color: var(--warning-color); color: var(--background-color); }
        .btn-stroked { background-color: transparent; color: var(--text-primary-color); border: 1px solid #ccc; }
        .btn-icon { background: none; padding: 8px; border-radius: 50%; line-height: 1; }
        .btn-icon:hover { background-color: rgba(0,0,0,0.05); }
        .btn-icon .material-symbols-outlined { color: var(--text-secondary-color); font-size: 22px; }
        .btn-icon.view .material-symbols-outlined { color: var(--primary-color); }
        .btn-icon.edit .material-symbols-outlined { color: var(--primary-color); }
        .btn-icon.delete .material-symbols-outlined { color: var(--warning-color); }

        /* ------------------------- */
        /* --- SEARCH & DATA TABLE --- */
        /* ------------------------- */
        .search-bar {
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            background-color: var(--body-bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--button-border-radius);
        }
        .search-bar .material-symbols-outlined { padding: 0 12px; color: var(--text-secondary-color); }
        .search-bar input { flex-grow: 1; padding: 12px 0; border: none; background: transparent; font-size: var(--body-font-size); }
        .search-bar input:focus { outline: none; }
        
        .table-container { width: 100%; overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 16px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .data-table th { font-family: var(--font-family-primary); font-weight: 600; color: var(--text-secondary-color); font-size: 14px; text-transform: uppercase; }
        .data-table .actions-cell { text-align: right; white-space: nowrap; display: flex; justify-content: flex-end; align-items: center; gap: 8px;}
        .empty-state { text-align: center; padding: 48px; color: var(--text-secondary-color); }

        /* ------------------------- */
        /* --- DIALOG / MODAL --- */
        /* ------------------------- */
        .dialog-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; visibility: hidden; transition: opacity 0.3s; }
        .dialog-backdrop.visible { opacity: 1; visibility: visible; }
        .dialog-content { background: var(--background-color); border-radius: var(--card-border-radius); padding: var(--card-padding); width: 90%; max-width: 600px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); transform: scale(0.9); transition: transform 0.3s; }
        .dialog-backdrop.visible .dialog-content { transform: scale(1); }
        .dialog-header { font-family: var(--font-family-primary); font-size: 22px; margin-bottom: 24px; }
        .dialog-body { margin-bottom: 24px; max-height: 70vh; overflow-y: auto; }
        .dialog-actions { display: flex; justify-content: flex-end; gap: 12px; }
        .dialog-content.delete-confirm .dialog-header { display: flex; align-items: center; gap: 16px; }
        .dialog-content.delete-confirm .material-symbols-outlined { color: var(--warning-color); }

        /* ------------------------- */
        /* --- FORM & VIEW STYLES --- */
        /* ------------------------- */
        .form-grid, .view-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .form-field, .view-item { margin-bottom: 20px; }
        .form-field label, .view-item .label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-secondary-color); font-size: 14px; }
        .form-field input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: var(--button-border-radius); font-size: var(--body-font-size); }
        .form-field input:focus { outline: none; border-color: var(--primary-color); }
        .view-item .value { font-size: var(--body-font-size); color: var(--text-primary-color); }

        /* ------------------------- */
        /* --- RESPONSIVENESS --- */
        /* ------------------------- */
        @media (max-width: 768px) {
            .data-table thead { display: none; }
            .data-table, .data-table tbody, .data-table tr, .data-table td { display: block; width: 100%; }
            .data-table tr { margin-bottom: 16px; border: 1px solid var(--border-color); border-radius: var(--card-border-radius); padding: 16px; }
            .data-table td { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border: none; text-align: right; }
            .data-table td::before { content: attr(data-label); font-weight: 600; color: var(--text-secondary-color); text-align: left; padding-right: 16px; }
            .data-table .actions-cell { justify-content: flex-end; }
            .data-table .actions-cell::before { display: none; }
        }
    </style>
</head>

<body>
    <div id="header-placeholder"></div>
    <main class="main-container">
        <header class="card-header">
            <h3>
                <span class="material-symbols-outlined">people_outline</span>
                My Customers
            </h3>
            <div class="header-actions">
                <a href="11screen.html" class="btn btn-stroked">
                    <span class="material-symbols-outlined">upload</span>
                    Import Customers
                </a>
                <button id="add-customer-btn" class="btn btn-primary">
                    <span class="material-symbols-outlined">person_add</span>
                    Add New Customer
                </button>
            </div>
        </header>

        <section class="search-bar">
            <span class="material-symbols-outlined">search</span>
            <input type="text" id="search-input" placeholder="Search by Name, Email, or Account ID...">
        </section>

        <section class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Customer Name</th>
                        <th>Account ID</th>
                        <th>Email Address</th>
                        <th>Phone Number</th>
                        <th class="actions-cell">Actions</th>
                    </tr>
                </thead>
                <tbody id="customer-table-body"></tbody>
            </table>
        </section>
    </main>

    <!-- Add/Edit Customer Dialog -->
    <div id="customer-dialog" class="dialog-backdrop">
        <div class="dialog-content">
            <h4 id="customer-dialog-title" class="dialog-header">Add New Customer</h4>
            <div class="dialog-body">
                <form id="customer-form">
                    <input type="hidden" id="customer-id">
                    <div class="form-grid">
                        <div class="form-field"><label for="customer-name">Full Name (Required)</label><input type="text" id="customer-name" required></div>
                        <div class="form-field"><label for="customer-accountId">Account ID</label><input type="text" id="customer-accountId"></div>
                        <div class="form-field"><label for="customer-email">Email (Required)</label><input type="email" id="customer-email" required></div>
                        <div class="form-field"><label for="customer-phone">Phone</label><input type="tel" id="customer-phone"></div>
                    </div>
                </form>
            </div>
            <div class="dialog-actions">
                <button id="cancel-customer-btn" class="btn btn-stroked">Cancel</button>
                <button id="save-customer-btn" type="submit" form="customer-form" class="btn btn-primary">Save Customer</button>
            </div>
        </div>
    </div>
    
    <!-- View Customer Dialog (NEW) -->
    <div id="view-customer-dialog" class="dialog-backdrop">
        <div class="dialog-content">
            <h4 id="view-customer-dialog-title" class="dialog-header">Customer Details</h4>
            <div class="dialog-body">
                <div class="view-grid" id="view-customer-details">
                    <!-- JS will populate this -->
                </div>
            </div>
            <div class="dialog-actions">
                <button id="close-view-btn" class="btn btn-primary">Close</button>
            </div>
        </div>
    </div>

    <!-- Assign Bill Dialog -->
    <div id="assign-bill-dialog" class="dialog-backdrop">
        <div class="dialog-content">
            <h4 id="assign-bill-dialog-title" class="dialog-header">Assign New Bill</h4>
            <div class="dialog-body">
                <form id="assign-bill-form">
                    <input type="hidden" id="assign-bill-customerId">
                    <div class="form-grid">
                        <div class="form-field"><label for="bill-number">Bill #</label><input type="text" id="bill-number" required></div>
                        <div class="form-field"><label for="bill-amount">Amount (JMD)</label><input type="number" id="bill-amount" step="0.01" required></div>
                        <div class="form-field"><label for="bill-dueDate">Due Date</label><input type="date" id="bill-dueDate" required></div>
                    </div>
                </form>
            </div>
            <div class="dialog-actions">
                <button id="cancel-bill-btn" class="btn btn-stroked">Cancel</button>
                <button id="save-bill-btn" type="submit" form="assign-bill-form" class="btn btn-primary">Save Bill</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Dialog -->
    <div id="delete-dialog" class="dialog-backdrop">
        <div class="dialog-content">
            <h4 class="dialog-header"><span class="material-symbols-outlined">warning</span> Delete Customer</h4>
            <div class="dialog-body">Are you sure you want to delete this customer? This action cannot be undone.</div>
            <div class="dialog-actions">
                <button id="cancel-delete-btn" class="btn btn-stroked">Cancel</button>
                <button id="confirm-delete-btn" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- LOCALSTORAGE KEYS ---
            const CUSTOMER_KEY = 'biller_customers';
            const BILL_KEY = 'biller_bills';
            const ACTIVITY_KEY = 'biller_activity';

            // --- DOM REFERENCES ---
            const addCustomerBtn = document.getElementById('add-customer-btn');
            const searchInput = document.getElementById('search-input');
            const tableBody = document.getElementById('customer-table-body');
            
            // Customer Dialog
            const customerDialog = document.getElementById('customer-dialog');
            const customerDialogTitle = document.getElementById('customer-dialog-title');
            const customerForm = document.getElementById('customer-form');
            const customerIdInput = document.getElementById('customer-id');
            const cancelCustomerBtn = document.getElementById('cancel-customer-btn');
            
            // View Dialog (NEW)
            const viewCustomerDialog = document.getElementById('view-customer-dialog');
            const viewCustomerDialogTitle = document.getElementById('view-customer-dialog-title');
            const viewCustomerDetails = document.getElementById('view-customer-details');
            const closeViewBtn = document.getElementById('close-view-btn');

            // Assign Bill Dialog
            const assignBillDialog = document.getElementById('assign-bill-dialog');
            const assignBillDialogTitle = document.getElementById('assign-bill-dialog-title');
            const assignBillForm = document.getElementById('assign-bill-form');
            const assignBillCustomerIdInput = document.getElementById('assign-bill-customerId');
            const cancelBillBtn = document.getElementById('cancel-bill-btn');
            
            // Delete Dialog
            const deleteDialog = document.getElementById('delete-dialog');
            const cancelDeleteBtn = document.getElementById('cancel-delete-btn');
            const confirmDeleteBtn = document.getElementById('confirm-delete-btn');

            let allCustomers = [];
            let customerToDeleteId = null;

            // --- DATA MANAGEMENT & SYNC ---
            const getData = (key) => JSON.parse(localStorage.getItem(key) || '[]');
            const saveData = (key, data) => localStorage.setItem(key, JSON.stringify(data));

            const logActivity = (message, icon = 'info') => {
                const activityLog = getData(ACTIVITY_KEY);
                activityLog.unshift({ icon, message, timestamp: new Date().toISOString() });
                if (activityLog.length > 20) activityLog.pop();
                saveData(ACTIVITY_KEY, activityLog);
            };

            // --- UI RENDERING ---
            const renderTable = (customersToRender) => {
                tableBody.innerHTML = '';
                if (customersToRender.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="empty-state">No customers found.</td></tr>`;
                    return;
                }
                customersToRender.forEach(customer => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td data-label="Customer Name">${customer.name}</td>
                        <td data-label="Account ID">${customer.accountId || 'N/A'}</td>
                        <td data-label="Email Address">${customer.email}</td>
                        <td data-label="Phone Number">${customer.phone || 'N/A'}</td>
                        <td class="actions-cell">
                            <button class="btn btn-primary assign-bill" data-id="${customer.id}" data-name="${customer.name}" style="padding: 8px 16px;">
                                <span class="material-symbols-outlined" style="font-size: 20px;">post_add</span> Assign Bill
                            </button>
                            <button class="btn btn-icon view" data-id="${customer.id}" title="View Customer"><span class="material-symbols-outlined">visibility</span></button>
                            <button class="btn btn-icon edit" data-id="${customer.id}" title="Edit Customer"><span class="material-symbols-outlined">edit</span></button>
                            <button class="btn btn-icon delete" data-id="${customer.id}" title="Delete Customer"><span class="material-symbols-outlined">delete_outline</span></button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            };

            const applySearchFilter = () => {
                const searchTerm = searchInput.value.toLowerCase();
                const filtered = !searchTerm
                    ? allCustomers
                    : allCustomers.filter(c =>
                        c.name.toLowerCase().includes(searchTerm) ||
                        c.email.toLowerCase().includes(searchTerm) ||
                        (c.accountId && c.accountId.toLowerCase().includes(searchTerm))
                    );
                renderTable(filtered);
            };

            // --- DIALOG LOGIC ---
            const openDialog = (el) => el.classList.add('visible');
            const closeDialog = (el) => el.classList.remove('visible');

            const openAddCustomerDialog = () => {
                customerForm.reset();
                customerIdInput.value = '';
                customerDialogTitle.textContent = 'Add New Customer';
                openDialog(customerDialog);
            };

            const openEditCustomerDialog = (id) => {
                const customer = allCustomers.find(c => c.id === id);
                if (customer) {
                    customerDialogTitle.textContent = 'Edit Customer Details';
                    customerIdInput.value = customer.id;
                    document.getElementById('customer-name').value = customer.name || '';
                    document.getElementById('customer-accountId').value = customer.accountId || '';
                    document.getElementById('customer-email').value = customer.email || '';
                    document.getElementById('customer-phone').value = customer.phone || '';
                    openDialog(customerDialog);
                }
            };
            
            const openViewCustomerDialog = (id) => {
                const customer = allCustomers.find(c => c.id === id);
                if (customer) {
                    viewCustomerDialogTitle.textContent = `Details for ${customer.name}`;
                    viewCustomerDetails.innerHTML = `
                        <div class="view-item"><span class="label">Full Name:</span><span class="value">${customer.name || 'N/A'}</span></div>
                        <div class="view-item"><span class="label">Account ID:</span><span class="value">${customer.accountId || 'N/A'}</span></div>
                        <div class="view-item"><span class="label">Email:</span><span class="value">${customer.email || 'N/A'}</span></div>
                        <div class="view-item"><span class="label">Phone:</span><span class="value">${customer.phone || 'N/A'}</span></div>
                    `;
                    openDialog(viewCustomerDialog);
                }
            };

            const openAssignBillDialog = (customerId, customerName) => {
                assignBillForm.reset();
                assignBillCustomerIdInput.value = customerId;
                assignBillDialogTitle.textContent = `Assign New Bill to ${customerName}`;
                openDialog(assignBillDialog);
            };

            // --- EVENT LISTENERS ---
            addCustomerBtn.addEventListener('click', openAddCustomerDialog);
            searchInput.addEventListener('input', applySearchFilter);

            // Add/Edit Dialog
            cancelCustomerBtn.addEventListener('click', () => closeDialog(customerDialog));
            customerForm.addEventListener('submit', e => { e.preventDefault(); /* ... same as before ... */ });
            
            // View Dialog (NEW)
            closeViewBtn.addEventListener('click', () => closeDialog(viewCustomerDialog));
            
            // Assign Bill Dialog
            cancelBillBtn.addEventListener('click', () => closeDialog(assignBillDialog));
            assignBillForm.addEventListener('submit', e => { e.preventDefault(); /* ... same as before ... */ });

            // Table Actions
            tableBody.addEventListener('click', e => {
                const button = e.target.closest('button');
                if (!button) return;

                const id = button.dataset.id;
                if (button.classList.contains('edit')) openEditCustomerDialog(id);
                if (button.classList.contains('delete')) {
                    customerToDeleteId = id;
                    openDialog(deleteDialog);
                }
                if (button.classList.contains('assign-bill')) openAssignBillDialog(id, button.dataset.name);
                if (button.classList.contains('view')) openViewCustomerDialog(id);
            });
            
            // Delete Dialog Logic
            cancelDeleteBtn.addEventListener('click', () => closeDialog(deleteDialog));
            confirmDeleteBtn.addEventListener('click', () => { /* ... same as before ... */ });

            // --- INITIALIZATION ---
            // All other functions (form submissions, delete confirmation) remain the same.
            // ... [The rest of the JS code for submissions and delete logic goes here] ...
             customerForm.addEventListener('submit', e => {
                e.preventDefault();
                const id = customerIdInput.value;
                const customerData = {
                    name: document.getElementById('customer-name').value,
                    accountId: document.getElementById('customer-accountId').value,
                    email: document.getElementById('customer-email').value,
                    phone: document.getElementById('customer-phone').value,
                };

                if (id) { // Editing
                    const index = allCustomers.findIndex(c => c.id === id);
                    allCustomers[index] = { ...allCustomers[index], ...customerData };
                    logActivity(`Details for "${customerData.name}" were updated.`, 'edit');
                } else { // Adding
                    customerData.id = 'c' + Date.now();
                    allCustomers.push(customerData);
                    logActivity(`New customer "${customerData.name}" was added.`, 'person_add');
                }
                saveData(CUSTOMER_KEY, allCustomers);
                applySearchFilter();
                closeDialog(customerDialog);
            });
            
            assignBillForm.addEventListener('submit', e => {
                e.preventDefault();
                const bills = getData(BILL_KEY);
                const newBill = {
                    id: 'b' + Date.now(),
                    customerId: assignBillCustomerIdInput.value,
                    billNumber: document.getElementById('bill-number').value,
                    amount: parseFloat(document.getElementById('bill-amount').value),
                    dueDate: document.getElementById('bill-dueDate').value,
                    status: 'Unpaid'
                };
                bills.push(newBill);
                saveData(BILL_KEY, bills);
                
                const customer = allCustomers.find(c => c.id === newBill.customerId);
                logActivity(`New bill #${newBill.billNumber} created for ${customer.name}.`, 'post_add');
                
                closeDialog(assignBillDialog);
                alert(`Bill #${newBill.billNumber} has been assigned successfully!`);
            });
            
            confirmDeleteBtn.addEventListener('click', () => {
                if (customerToDeleteId) {
                    const customerToDelete = allCustomers.find(c => c.id === customerToDeleteId);
                    allCustomers = allCustomers.filter(c => c.id !== customerToDeleteId);
                    saveData(CUSTOMER_KEY, allCustomers);
                    logActivity(`Customer "${customerToDelete.name}" was deleted.`, 'delete');
                    applySearchFilter();
                    closeDialog(deleteDialog);
                    customerToDeleteId = null;
                }
            });


            const initializeApp = () => {
                allCustomers = getData(CUSTOMER_KEY);
                renderTable(allCustomers);
            };

            initializeApp();
        });
    </script>
     </script>
        <script>
        fetch("header.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("header-placeholder").innerHTML = html;

                // 🟢 NOW that header is injected, attach dropdown toggle
                document.addEventListener('click', function (e) {
                    const isDropdownBtn = e.target.closest('.dropdown-button');
                    const dropdowns = document.querySelectorAll('.dropdown');

                    dropdowns.forEach(drop => {
                        if (drop.contains(e.target)) {
                            if (isDropdownBtn) {
                                drop.classList.toggle('open');
                            }
                        } else {
                            drop.classList.remove('open');
                        }
                    });
                });
            });
    </script>
</body>
</html>
