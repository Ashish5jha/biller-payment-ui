<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screen 1.1: Module Management</title>

  <!-- Google Fonts: Poppins & Open Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />

  <!-- Material Icons Outlined -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />

  <!-- React and Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Material-UI (MUI v5) -->
  <script src="https://unpkg.com/@mui/material@5.15.20/umd/material-ui.development.js" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Open Sans', sans-serif;
      background-color: #f4f6f8;
      /* A slightly cooler, more modern admin background */
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const {
      createTheme,
      ThemeProvider,
      CssBaseline,
      Box,
      Container,
      Card,
      Typography,
      Button,
      Table,
      TableBody,
      TableCell,
      TableContainer,
      TableHead,
      TableRow,
      IconButton,
      Dialog,
      DialogActions,
      DialogContent,
      DialogTitle,
      TextField,
      Snackbar,
      Alert,
      Tooltip,
      useMediaQuery
    } = MaterialUI;

    // 1. THEME DEFINITION (as per design specs)
    const theme = createTheme({
      palette: {
        primary: {
          main: '#007a3d',
        },
        secondary: {
          main: '#fdd835',
        },
        text: {
          primary: '#212121',
          secondary: '#6b6b6b',
        },
        background: {
          default: '#f4f6f8',
          paper: '#ffffff',
        },
        error: {
          main: '#d32f2f', // Standard MUI red for delete button
        },
      },
      typography: {
        fontFamily: "'Open Sans', sans-serif",
        h4: {
          fontFamily: "'Poppins', sans-serif",
          fontWeight: 700,
          fontSize: '1.75rem', // Responsive font size
        },
        h6: {
          fontFamily: "'Poppins', sans-serif",
          fontWeight: 600,
        },
        button: {
          textTransform: 'none',
          fontWeight: 600,
        },
      },
      shape: {
        borderRadius: 8,
      },
      components: {
        MuiCard: {
          styleOverrides: {
            root: {
              boxShadow: '0 4px 20px rgba(0, 0, 0, 0.05)',
              padding: '16px', // Tighter padding
            },
          },
        },
        MuiButton: {
          styleOverrides: {
            root: {
              padding: '8px 20px', // Tighter padding
            },
          },
        },
        MuiDialog: {
            styleOverrides: {
                paper: {
                    borderRadius: 12, // Softer dialog corners
                }
            }
        },
        MuiTableCell: {
            styleOverrides: {
                head: {
                    fontWeight: 600,
                    color: '#212121',
                    backgroundColor: '#fafafa',
                }
            }
        }
      },
    });

    // 2. MOCK DATA
    const initialModules = [
        { id: 1, name: 'Biller Management', description: 'Onboarding and management of all biller organizations.', sortOrder: 10 },
        { id: 2, name: 'User Administration', description: 'Management of users, roles, and permissions.', sortOrder: 20 },
        { id: 3, name: 'System Reporting', description: 'Access to financial and operational reports.', sortOrder: 30 },
        { id: 4, name: 'Customer Self-Service', description: 'Features available to the end customer portal.', sortOrder: 40 },
    ];

    // 3. REUSABLE DIALOG COMPONENT
    function ModuleDialog({ open, onClose, onSave, module, isEditing }) {
      const [formData, setFormData] = React.useState(module);

      React.useEffect(() => {
        setFormData(module);
      }, [module]);

      const handleChange = (event) => {
        const { name, value } = event.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const handleSave = () => {
        onSave(formData);
      };

      if (!module) return null;

      return (
        <Dialog open={open} onClose={onClose} fullWidth maxWidth="sm">
          <DialogTitle sx={{ typography: 'h6' }}>
            {isEditing ? 'Edit Module' : 'Add New Module'}
          </DialogTitle>
          <DialogContent>
            <TextField
              autoFocus
              required
              margin="normal"
              name="name"
              label="Module Name"
              type="text"
              fullWidth
              variant="outlined"
              value={formData.name || ''}
              onChange={handleChange}
            />
            <TextField
              margin="normal"
              name="description"
              label="Description"
              type="text"
              fullWidth
              variant="outlined"
              multiline
              rows={3}
              value={formData.description || ''}
              onChange={handleChange}
            />
            <TextField
              margin="normal"
              required
              name="sortOrder"
              label="Sort Order"
              type="number"
              fullWidth
              variant="outlined"
              value={formData.sortOrder || ''}
              onChange={handleChange}
            />
          </DialogContent>
          <DialogActions sx={{ p: '16px 24px' }}>
            <Button onClick={onClose} variant="outlined">Cancel</Button>
            <Button onClick={handleSave} variant="contained" color="primary">Save</Button>
          </DialogActions>
        </Dialog>
      );
    }
    
    // 4. REUSABLE CONFIRMATION DIALOG
    function ConfirmationDialog({ open, onClose, onConfirm, title, children }) {
        return (
             <Dialog open={open} onClose={onClose} maxWidth="xs">
                <DialogTitle sx={{ display: 'flex', alignItems: 'center' }}>
                    <span className="material-icons-outlined" style={{ color: theme.palette.error.main, marginRight: '8px' }}>warning_outlined</span>
                    {title}
                </DialogTitle>
                <DialogContent>
                    <Typography variant="body2">{children}</Typography>
                </DialogContent>
                <DialogActions sx={{ p: '16px 24px' }}>
                    <Button onClick={onClose} variant="outlined">Cancel</Button>
                    <Button onClick={onConfirm} variant="contained" color="error">
                        Confirm
                    </Button>
                </DialogActions>
            </Dialog>
        );
    }


    // 5. MAIN COMPONENT
    function ModuleManagement() {
      const [modules, setModules] = React.useState(initialModules);
      const [dialogOpen, setDialogOpen] = React.useState(false);
      const [confirmOpen, setConfirmOpen] = React.useState(false);
      const [isEditing, setIsEditing] = React.useState(false);
      const [currentModule, setCurrentModule] = React.useState(null);
      const [snackbar, setSnackbar] = React.useState({ open: false, message: '', severity: 'success' });

      const isMobile = useMediaQuery(theme.breakpoints.down('sm'));

      const handleOpenDialog = (module = null) => {
        setIsEditing(!!module);
        setCurrentModule(module || { id: null, name: '', description: '', sortOrder: '' });
        setDialogOpen(true);
      };

      const handleCloseDialog = () => {
        setDialogOpen(false);
        setCurrentModule(null);
      };
      
      const handleOpenConfirm = (module) => {
          setCurrentModule(module);
          setConfirmOpen(true);
      };
      
      const handleCloseConfirm = () => {
          setConfirmOpen(false);
          setCurrentModule(null);
      };

      const handleSaveModule = (moduleData) => {
        if (isEditing) {
          setModules(modules.map(m => m.id === moduleData.id ? moduleData : m));
          setSnackbar({ open: true, message: 'Module updated successfully!', severity: 'success' });
        } else {
          setModules([...modules, { ...moduleData, id: Date.now() }]); // Mock ID
          setSnackbar({ open: true, message: 'Module added successfully!', severity: 'success' });
        }
        handleCloseDialog();
      };

      const handleDeleteModule = () => {
        setModules(modules.filter(m => m.id !== currentModule.id));
        setSnackbar({ open: true, message: 'Module deleted.', severity: 'error' });
        handleCloseConfirm();
      };
      
      const handleCloseSnackbar = () => setSnackbar({ ...snackbar, open: false });

      return (
        <Container maxWidth="lg" sx={{ py: { xs: 2, md: 4 } }}>
          <Card>
            {/* Header and Action Button */}
            <Box
              sx={{
                display: 'flex',
                flexDirection: { xs: 'column', sm: 'row' },
                justifyContent: 'space-between',
                alignItems: { xs: 'flex-start', sm: 'center' },
                mb: 3,
                p: 2,
              }}
            >
              <Box sx={{ display: 'flex', alignItems: 'center', mb: { xs: 2, sm: 0 } }}>
                <span className="material-icons-outlined" style={{ color: theme.palette.primary.main, fontSize: '2rem', marginRight: '12px' }}>view_module</span>
                <Typography variant="h4" component="h1">
                  Module Management
                </Typography>
              </Box>
              <Button
                variant="contained"
                color="primary"
                startIcon={<span className="material-icons-outlined">add</span>}
                onClick={() => handleOpenDialog()}
              >
                Add New Module
              </Button>
            </Box>

            {/* Data Table */}
            <TableContainer>
              <Table sx={{ minWidth: 650 }} aria-label="module management table">
                <TableHead>
                  <TableRow>
                    <TableCell>Name</TableCell>
                    {!isMobile && <TableCell>Description</TableCell>}
                    <TableCell align="center">Sort Order</TableCell>
                    <TableCell align="right">Actions</TableCell>
                  </TableRow>
                </TableHead>
                <TableBody>
                  {modules.map((module) => (
                    <TableRow key={module.id} hover sx={{ '&:last-child td, &:last-child th': { border: 0 } }}>
                      <TableCell component="th" scope="row">
                        {module.name}
                      </TableCell>
                      {!isMobile && <TableCell sx={{ color: 'text.secondary' }}>{module.description}</TableCell>}
                      <TableCell align="center">{module.sortOrder}</TableCell>
                      <TableCell align="right">
                        <Tooltip title="Edit">
                          <IconButton onClick={() => handleOpenDialog(module)} sx={{ color: '#007a3d' }}>
                             <span className="material-icons-outlined">edit</span>
                          </IconButton>
                        </Tooltip>
                        <Tooltip title="Delete">
                          <IconButton onClick={() => handleOpenConfirm(module)} sx={{ color: '#6b6b6b' }}>
                            <span className="material-icons-outlined">delete_outline</span>
                          </IconButton>
                        </Tooltip>
                      </TableCell>
                    </TableRow>
                  ))}
                </TableBody>
              </Table>
            </TableContainer>
          </Card>

          {/* Dialogs and Feedback */}
          <ModuleDialog 
            open={dialogOpen}
            onClose={handleCloseDialog}
            onSave={handleSaveModule}
            module={currentModule}
            isEditing={isEditing}
          />
          <ConfirmationDialog
            open={confirmOpen}
            onClose={handleCloseConfirm}
            onConfirm={handleDeleteModule}
            title="Confirm Deletion"
          >
            Are you sure you want to delete the module "{currentModule?.name}"? This action cannot be undone.
          </ConfirmationDialog>
          
          <Snackbar open={snackbar.open} autoHideDuration={4000} onClose={handleCloseSnackbar}>
            <Alert onClose={handleCloseSnackbar} severity={snackbar.severity} sx={{ width: '100%' }}>
              {snackbar.message}
            </Alert>
          </Snackbar>

        </Container>
      );
    }

    // 6. APP ROOT
    function App() {
      return (
        <ThemeProvider theme={theme}>
          <CssBaseline />
          <ModuleManagement />
        </ThemeProvider>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);

  </script>
</body>

</html>
