<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module Management</title>
    
    <!-- Fonts and Icons from Google CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <style>
        /* ------------------------- */
        /* --- DESIGN SYSTEM & SETUP --- */
        /* ------------------------- */
        :root {
            /* Branding Colors from Design.json */
            --primary-color: #007a3d;
            --secondary-color: #fdd835;
            --accent-color: #92278f;
            --text-primary-color: #212121;
            --text-secondary-color: #6b6b6b;
            --background-color: #ffffff;
            --warning-color-dark: #f57c00;
            --warning-color-light: #fff3e0;

            /* Typography */
            --font-family-primary: 'Poppins', sans-serif;
            --font-family-secondary: 'Open Sans', sans-serif;
            --h3-font-size: 28px;
            --body-font-size: 16px;

            /* Layout & Components */
            --max-width: 1200px;
            --card-border-radius: 8px;
            --card-box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            --card-padding: 24px;
            --button-border-radius: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family-secondary);
            background-color: #f7f7f7;
            color: var(--text-primary-color);
            line-height: 1.6;
            font-size: var(--body-font-size);
            padding: 32px 16px;
        }

        /* ------------------------- */
        /* --- MATERIAL ICONS --- */
        /* ------------------------- */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
            line-height: 1;
        }

        /* ------------------------- */
        /* --- MAIN CARD LAYOUT --- */
        /* ------------------------- */
        .main-container {
            max-width: var(--max-width);
            margin: 0 auto;
            background: var(--background-color);
            border-radius: var(--card-border-radius);
            box-shadow: var(--card-box-shadow);
            padding: var(--card-padding);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .card-header h3 {
            font-family: var(--font-family-primary);
            font-size: var(--h3-font-size);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-header h3 .material-symbols-outlined {
            color: var(--primary-color);
            font-size: 32px;
        }

        /* ------------------------- */
        /* --- BUTTONS --- */
        /* ------------------------- */
        .btn {
            border: none;
            border-radius: var(--button-border-radius);
            padding: 12px 24px;
            font-family: var(--font-family-secondary);
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.3s, box-shadow 0.3s;
            -webkit-tap-highlight-color: transparent; /* Remove tap highlight on mobile */
        }

        .btn:hover {
            opacity: 0.9;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            color: var(--background-color);
        }

        .btn-secondary {
            background-color: #e0e0e0;
            color: var(--text-primary-color);
        }
        
        .btn-icon {
            background: none;
            padding: 8px;
            border-radius: 50%;
            line-height: 1;
        }
        .btn-icon:hover {
            background-color: rgba(0,0,0,0.05);
        }
        .btn-icon .material-symbols-outlined {
            color: var(--text-secondary-color);
        }
        .btn-icon.edit .material-symbols-outlined {
            color: var(--primary-color);
        }

        /* ------------------------- */
        /* --- DATA TABLE --- */
        /* ------------------------- */
        .table-container {
            width: 100%;
            overflow-x: auto;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        .data-table th, .data-table td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #eeeeee;
        }
        .data-table th {
            font-family: var(--font-family-primary);
            font-weight: 600;
            color: var(--text-secondary-color);
            font-size: 14px;
            text-transform: uppercase;
        }
        .data-table td {
            color: var(--text-primary-color);
        }
        .data-table .actions-cell {
            text-align: right;
        }
        .empty-state {
            text-align: center;
            padding: 48px;
            color: var(--text-secondary-color);
        }
        
        /* ------------------------- */
        /* --- DIALOG / MODAL --- */
        /* ------------------------- */
        .dialog-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .dialog-backdrop.visible {
            opacity: 1;
            visibility: visible;
        }

        .dialog-content {
            background: var(--background-color);
            border-radius: var(--card-border-radius);
            padding: var(--card-padding);
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transform: scale(0.9);
            transition: transform 0.3s;
        }
        .dialog-backdrop.visible .dialog-content {
            transform: scale(1);
        }

        .dialog-header {
            font-family: var(--font-family-primary);
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .dialog-body {
            margin-bottom: 24px;
        }
        .dialog-body p {
            color: var(--text-secondary-color);
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
        
        /* Delete Dialog Specific */
        .dialog-content.delete-confirm .dialog-header {
             display: flex;
             align-items: center;
             gap: 16px;
        }
        .dialog-content.delete-confirm .material-symbols-outlined {
            color: var(--warning-color-dark);
            font-size: 28px;
        }
        
        /* ------------------------- */
        /* --- FORM FIELDS --- */
        /* ------------------------- */
        .form-field {
            margin-bottom: 20px;
        }
        .form-field label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary-color);
            font-size: 14px;
        }
        .form-field input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: var(--button-border-radius);
            font-size: var(--body-font-size);
            font-family: var(--font-family-secondary);
            transition: border-color 0.3s;
        }
        .form-field input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* ------------------------- */
        /* --- RESPONSIVENESS --- */
        /* ------------------------- */
        @media (max-width: 768px) {
            .data-table thead {
                display: none;
            }
            .data-table, .data-table tbody, .data-table tr {
                display: block;
                width: 100%;
            }
            .data-table tr {
                margin-bottom: 16px;
                border: 1px solid #eee;
                border-radius: var(--card-border-radius);
                padding: 16px;
            }
            .data-table td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 8px 0;
                border: none;
                text-align: right;
            }
            .data-table td::before {
                content: attr(data-label);
                font-weight: 600;
                color: var(--text-secondary-color);
                text-align: left;
                padding-right: 16px;
            }
            .data-table .actions-cell {
                justify-content: flex-end;
            }
            .data-table .actions-cell::before {
                display: none;
            }
        }

    </style>
</head>
<body>

    <main class="main-container">
        <header class="card-header">
            <h3>
                <span class="material-symbols-outlined">view_module</span>
                Application Module Management
            </h3>
            <button id="add-module-btn" class="btn btn-primary">
                <span class="material-symbols-outlined">add</span>
                Add New Module
            </button>
        </header>

        <section class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Sort Order</th>
                        <th class="actions-cell">Actions</th>
                    </tr>
                </thead>
                <tbody id="module-table-body">
                    <!-- JS will populate this -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- Add/Edit Module Dialog -->
    <div id="module-dialog" class="dialog-backdrop">
        <div class="dialog-content">
            <h4 id="dialog-title" class="dialog-header">Add New Module</h4>
            <div class="dialog-body">
                <form id="module-form">
                    <input type="hidden" id="module-id">
                    <div class="form-field">
                        <label for="module-name">Name</label>
                        <input type="text" id="module-name" required>
                    </div>
                    <div class="form-field">
                        <label for="module-description">Description</label>
                        <input type="text" id="module-description" required>
                    </div>
                    <div class="form-field">
                        <label for="module-sort-order">Sort Order</label>
                        <input type="number" id="module-sort-order" required>
                    </div>
                </form>
            </div>
            <div class="dialog-actions">
                <button id="cancel-btn" class="btn btn-secondary">Cancel</button>
                <button id="save-btn" type="submit" form="module-form" class="btn btn-primary">Save</button>
            </div>
        </div>
    </div>
    
    <!-- Delete Confirmation Dialog -->
    <div id="delete-dialog" class="dialog-backdrop">
        <div class="dialog-content delete-confirm">
            <h4 class="dialog-header">
                 <span class="material-symbols-outlined">warning</span>
                 Delete Module
            </h4>
            <div class="dialog-body">
                <p>Are you sure you want to delete this module? This action cannot be undone.</p>
            </div>
            <div class="dialog-actions">
                <button id="cancel-delete-btn" class="btn btn-secondary">Cancel</button>
                <button id="confirm-delete-btn" class="btn btn-primary">Delete</button>
            </div>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', () => {

            const APP_DATA_KEY = 'modules';

            // --- DOM ELEMENT REFERENCES ---
            const addModuleBtn = document.getElementById('add-module-btn');
            const tableBody = document.getElementById('module-table-body');
            
            // Add/Edit Dialog
            const moduleDialog = document.getElementById('module-dialog');
            const dialogTitle = document.getElementById('dialog-title');
            const moduleForm = document.getElementById('module-form');
            const moduleIdInput = document.getElementById('module-id');
            const moduleNameInput = document.getElementById('module-name');
            const moduleDescriptionInput = document.getElementById('module-description');
            const moduleSortOrderInput = document.getElementById('module-sort-order');
            const cancelBtn = document.getElementById('cancel-btn');

            // Delete Dialog
            const deleteDialog = document.getElementById('delete-dialog');
            const cancelDeleteBtn = document.getElementById('cancel-delete-btn');
            const confirmDeleteBtn = document.getElementById('confirm-delete-btn');
            
            let modules = [];
            let moduleToDeleteId = null;

            // --- DATA MANAGEMENT (localStorage) ---
            // This function is the SOURCE OF TRUTH for modules.
            // It reads from localStorage or creates default data if it's the very first run.
            const getModules = () => {
                const storedModules = localStorage.getItem(APP_DATA_KEY);
                if (storedModules) {
                    return JSON.parse(storedModules);
                }
                // Pre-populate with some data if none exists.
                // This will only run once for the entire application.
                const defaultData = [
                    { id: 'm1', name: 'Dashboard', description: 'The main dashboard view.', sortOrder: 1 },
                    { id: 'm2', name: 'User Management', description: 'Manage users and roles.', sortOrder: 2 },
                    { id: 'm3', name: 'Reporting', description: 'View and export reports.', sortOrder: 3 }
                ];
                saveModules(defaultData); // Save the defaults so other screens can find them
                return defaultData;
            };

            // This function SAVES the master list of modules to localStorage.
            const saveModules = (data) => {
                localStorage.setItem(APP_DATA_KEY, JSON.stringify(data));
            };

            // --- UI RENDERING ---
            const renderTable = () => {
                tableBody.innerHTML = '';
                if (modules.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="4" class="empty-state">No modules found. Add one to get started.</td>
                        </tr>`;
                    return;
                }
                
                const sortedModules = [...modules].sort((a, b) => a.sortOrder - b.sortOrder);

                sortedModules.forEach(module => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td data-label="Name">${module.name}</td>
                        <td data-label="Description">${module.description}</td>
                        <td data-label="Sort Order">${module.sortOrder}</td>
                        <td class="actions-cell">
                            <button class="btn btn-icon edit" data-id="${module.id}" title="Edit Module">
                                <span class="material-symbols-outlined">edit</span>
                            </button>
                            <button class="btn btn-icon delete" data-id="${module.id}" title="Delete Module">
                                <span class="material-symbols-outlined">delete_outline</span>
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            };

            // --- DIALOG MANAGEMENT ---
            const openDialog = (dialogElement) => dialogElement.classList.add('visible');
            const closeDialog = (dialogElement) => dialogElement.classList.remove('visible');

            const openAddDialog = () => {
                moduleForm.reset();
                moduleIdInput.value = '';
                dialogTitle.textContent = 'Add New Module';
                openDialog(moduleDialog);
            };

            const openEditDialog = (id) => {
                const module = modules.find(m => m.id === id);
                if (module) {
                    dialogTitle.textContent = 'Edit Module';
                    moduleIdInput.value = module.id;
                    moduleNameInput.value = module.name;
                    moduleDescriptionInput.value = module.description;
                    moduleSortOrderInput.value = module.sortOrder;
                    openDialog(moduleDialog);
                }
            };
            
            const openDeleteDialog = (id) => {
                moduleToDeleteId = id;
                openDialog(deleteDialog);
            };

            // --- EVENT LISTENERS ---
            addModuleBtn.addEventListener('click', openAddDialog);
            cancelBtn.addEventListener('click', () => closeDialog(moduleDialog));
            moduleDialog.addEventListener('click', (e) => e.target === moduleDialog && closeDialog(moduleDialog));

            moduleForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const id = moduleIdInput.value;
                const newModule = {
                    name: moduleNameInput.value,
                    description: moduleDescriptionInput.value,
                    sortOrder: parseInt(moduleSortOrderInput.value, 10)
                };

                if (id) {
                    const index = modules.findIndex(m => m.id === id);
                    modules[index] = { ...modules[index], ...newModule };
                } else {
                    newModule.id = 'm' + Date.now();
                    modules.push(newModule);
                }

                saveModules(modules);
                renderTable();
                closeDialog(moduleDialog);
            });

            tableBody.addEventListener('click', (e) => {
                const editButton = e.target.closest('button.edit');
                const deleteButton = e.target.closest('button.delete');
                if (editButton) openEditDialog(editButton.dataset.id);
                if (deleteButton) openDeleteDialog(deleteButton.dataset.id);
            });

            cancelDeleteBtn.addEventListener('click', () => closeDialog(deleteDialog));
            deleteDialog.addEventListener('click', (e) => e.target === deleteDialog && closeDialog(deleteDialog));
            
            confirmDeleteBtn.addEventListener('click', () => {
                if (moduleToDeleteId) {
                    modules = modules.filter(m => m.id !== moduleToDeleteId);
                    saveModules(modules);
                    renderTable();
                    closeDialog(deleteDialog);
                    moduleToDeleteId = null;
                }
            });

            // --- INITIALIZATION ---
            const initializeApp = () => {
                modules = getModules();
                renderTable();
            };

            initializeApp();
        });
    </script>

</body>
</html>
