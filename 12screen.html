<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill & Payment Management</title>
    
    <!-- Fonts and Icons from Google CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <style>
        /* ------------------------- */
        /* --- DESIGN SYSTEM & SETUP --- */
        /* ------------------------- */
        :root {
            /* Branding Colors */
            --primary-color: #007a3d;
            --text-primary-color: #212121;
            --text-secondary-color: #6b6b6b;
            --background-color: #ffffff;
            --body-bg-color: #f7f7f7;
            --border-color: #eeeeee;
            --warning-color: #d32f2f;
            
            /* Status Chip Colors */
            --status-paid-bg: #e8f5e9; --status-paid-text: #2e7d32;
            --status-unpaid-bg: #e3f2fd; --status-unpaid-text: #0d47a1;
            --status-overdue-bg: #ffebee; --status-overdue-text: var(--warning-color);
            --status-cancelled-bg: #f5f5f5; --status-cancelled-text: #616161;

            /* Typography */
            --font-family-primary: 'Poppins', sans-serif;
            --font-family-secondary: 'Open Sans', sans-serif;
            --h3-font-size: 28px;
            --body-font-size: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-family-secondary);
            background-color: var(--body-bg-color);
            color: var(--text-primary-color);
            line-height: 1.6;
            font-size: var(--body-font-size);
            padding: 32px 16px;
        }
        
        /* ------------------------- */
        /* --- MAIN LAYOUT & CARD --- */
        /* ------------------------- */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--background-color);
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            padding: 24px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .card-header h3 {
            font-family: var(--font-family-primary);
            font-size: var(--h3-font-size);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-header h3 .material-symbols-outlined { color: var(--primary-color); font-size: 32px; }
        .header-actions { display: flex; gap: 16px; flex-wrap: wrap; }

        /* ------------------------- */
        /* --- BUTTONS & CHIPS --- */
        /* ------------------------- */
        .btn {
            border: none; border-radius: 6px; padding: 12px 24px;
            font-family: var(--font-family-secondary); font-weight: 600; font-size: 16px;
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; transition: opacity 0.3s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { background-color: #bdbdbd !important; cursor: not-allowed; }
        .btn-primary { background-color: var(--primary-color); color: var(--background-color); }
        .btn-stroked { background-color: transparent; color: var(--text-primary-color); border: 1px solid #ccc; }
        .btn-icon { background: none; padding: 8px; border-radius: 50%; line-height: 1; }
        .btn-icon:hover { background-color: rgba(0,0,0,0.05); }
        .btn-icon .material-symbols-outlined { color: var(--text-secondary-color); }
        .btn-icon.view .material-symbols-outlined { color: var(--primary-color); }
        .btn-icon.delete .material-symbols-outlined { color: var(--warning-color); }

        .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 16px; font-size: 13px; font-weight: 600; }
        .chip-paid { background-color: var(--status-paid-bg); color: var(--status-paid-text); }
        .chip-unpaid { background-color: var(--status-unpaid-bg); color: var(--status-unpaid-text); }
        .chip-overdue { background-color: var(--status-overdue-bg); color: var(--status-overdue-text); }
        .chip-cancelled { background-color: var(--status-cancelled-bg); color: var(--status-cancelled-text); }
        
        /* ------------------------- */
        /* --- FILTERS & TABLE --- */
        /* ------------------------- */
        .filters-container { padding: 16px; background-color: var(--body-bg-color); border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 24px; }
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; align-items: flex-end; }
        .form-field label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-secondary-color); font-size: 14px; }
        .form-field input, .form-field select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: var(--body-font-size); }
        .form-field input:focus, .form-field select:focus { outline: none; border-color: var(--primary-color); }
        
        .table-container { width: 100%; overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 16px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .data-table th { font-family: var(--font-family-primary); font-weight: 600; color: var(--text-secondary-color); font-size: 14px; text-transform: uppercase; }
        .data-table .actions-cell { text-align: right; }
        .empty-state { text-align: center; padding: 48px; color: var(--text-secondary-color); }
        
        /* ------------------------- */
        /* --- BILL FORM DIALOG (IMPROVED) --- */
        /* ------------------------- */
        .dialog-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; visibility: hidden; transition: opacity 0.3s; }
        .dialog-backdrop.visible { opacity: 1; visibility: visible; }
        .dialog-content { background: var(--background-color); border-radius: var(--card-border-radius); padding: var(--card-padding); width: 95%; max-width: 800px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); transform: scale(0.9); transition: transform 0.3s; }
        .dialog-backdrop.visible .dialog-content { transform: scale(1); padding: 2rem; border-radius: 7px; }
        .dialog-header { font-family: var(--font-family-primary); font-size: 22px; margin-bottom: 24px; }
        .dialog-body { margin-bottom: 24px; max-height: 70vh; overflow-y: auto; padding-right: 10px; }
        .dialog-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
        
        .form-section { border-bottom: 1px solid var(--border-color); padding-bottom: 16px; margin-bottom: 16px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        
        /* Autocomplete */
        .autocomplete { position: relative; }
        .autocomplete-items { position: absolute; border: 1px solid #d4d4d4; border-top: none; z-index: 99; top: 100%; left: 0; right: 0; background-color: #fff; max-height: 150px; overflow-y: auto; }
        .autocomplete-items div { padding: 10px; cursor: pointer; border-bottom: 1px solid #d4d4d4; }
        .autocomplete-items div:hover { background-color: #e9e9e9; }

        /* Line Items */
        .line-items-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        .line-items-table th, .line-items-table td { padding: 8px; text-align: left; }
        .line-items-table input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .line-items-table .actions-cell { width: 50px; }
        .line-items-table th { font-weight: 600; font-size: 14px; }
        .totals-section { margin-top: 24px; text-align: right; }
        .total-row { display: flex; justify-content: flex-end; gap: 40px; margin-bottom: 8px; font-size: 18px; }
        .total-row .label { font-weight: 600; color: var(--text-secondary-color); }
        .total-row.grand-total { font-family: var(--font-family-primary); font-weight: 700; font-size: 22px; }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>
    <main class="main-container">
        <header class="card-header">
            <h3>
                <span class="material-symbols-outlined">receipt_long</span>
                Bill & Payment Management
            </h3>
            <div class="header-actions">
                <a href="13screen.html" class="btn btn-stroked">
                    <span class="material-symbols-outlined">upload_file</span>
                    Import Bills
                </a>
                <button id="create-bill-btn" class="btn btn-primary">
                    <span class="material-symbols-outlined">post_add</span>
                    Create New Bill
                </button>
            </div>
        </header>

        <section class="filters-container">
            <div class="filter-grid">
                <div class="form-field"><label for="search-input">Search by Customer / Bill #</label><input type="text" id="search-input"></div>
                <div class="form-field"><label for="status-filter">Filter by Status</label><select id="status-filter">
                    <option value="All">All</option><option value="Unpaid">Unpaid</option><option value="Paid">Paid</option><option value="Overdue">Overdue</option><option value="Cancelled">Cancelled</option>
                </select></div>
                <div class="form-field"><label for="date-from">Due Date From</label><input type="date" id="date-from"></div>
                <div class="form-field"><label for="date-to">Due Date To</label><input type="date" id="date-to"></div>
            </div>
        </section>

        <section class="table-container">
            <table class="data-table">
                <thead><tr><th>Customer Name</th><th>Bill #</th><th>Amount</th><th>Due Date</th><th>Status</th><th class="actions-cell">Actions</th></tr></thead>
                <tbody id="bill-table-body"></tbody>
            </table>
        </section>
    </main>
    
    <!-- Screen 4.2: Create/Edit Bill Dialog -->
    <div id="bill-dialog" class="dialog-backdrop">
        <div class="dialog-content">
            <h4 id="bill-dialog-title" class="dialog-header">Create New Bill</h4>
            <div class="dialog-body">
                <form id="bill-form" novalidate>
                    <input type="hidden" id="bill-id">
                    <div class="form-section">
                        <h5>Customer Selection</h5>
                        <div class="form-field autocomplete">
                            <label for="customer-search">Select a Customer (Required)</label>
                            <input type="text" id="customer-search" placeholder="Start typing customer name..." required>
                            <input type="hidden" id="selected-customer-id">
                        </div>
                    </div>
                    <div class="form-section">
                        <h5>Bill Information</h5>
                        <div class="form-grid">
                            <div class="form-field"><label for="bill-number">Bill Number</label><input type="text" id="bill-number" required></div>
                            <div class="form-field"><label for="bill-date">Bill Date</label><input type="date" id="bill-date" required></div>
                            <div class="form-field"><label for="bill-dueDate">Due Date</label><input type="date" id="bill-dueDate" required></div>
                        </div>
                    </div>
                    <div class="form-section">
                        <h5>Line Items (At least one required)</h5>
                        <table class="line-items-table">
                            <thead><tr><th>Description</th><th>Quantity</th><th>Unit Price</th><th></th></tr></thead>
                            <tbody id="line-items-body"></tbody>
                        </table>
                        <button type="button" id="add-line-item-btn" class="btn btn-stroked" style="margin-top: 16px;">
                            <span class="material-symbols-outlined">add</span> Add Line Item
                        </button>
                    </div>
                    <div class="totals-section">
                        <div class="total-row"><span class="label">Subtotal:</span><span id="subtotal-display">$0.00</span></div>
                        <div class="total-row grand-total"><span class="label">Grand Total:</span><span id="grandtotal-display">$0.00</span></div>
                    </div>
                </form>
            </div>
            <div class="dialog-actions">
                <button id="cancel-bill-btn" class="btn btn-stroked">Cancel</button>
                <button id="save-bill-btn" type="submit" form="bill-form" class="btn btn-primary">Save Bill</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- LOCALSTORAGE KEYS ---
            const CUSTOMER_KEY = 'biller_customers';
            const BILL_KEY = 'biller_bills';

            // --- DOM REFERENCES ---
            const searchInput = document.getElementById('search-input');
            const statusFilter = document.getElementById('status-filter');
            const dateFromInput = document.getElementById('date-from');
            const dateToInput = document.getElementById('date-to');
            const tableBody = document.getElementById('bill-table-body');
            const createBillBtn = document.getElementById('create-bill-btn');
            
            // Bill Dialog (Screen 4.2)
            const billDialog = document.getElementById('bill-dialog');
            const billDialogTitle = document.getElementById('bill-dialog-title');
            const billForm = document.getElementById('bill-form');
            const billIdInput = document.getElementById('bill-id');
            const customerSearchInput = document.getElementById('customer-search');
            const selectedCustomerIdInput = document.getElementById('selected-customer-id');
            const lineItemsBody = document.getElementById('line-items-body');
            const addLineItemBtn = document.getElementById('add-line-item-btn');
            const subtotalDisplay = document.getElementById('subtotal-display');
            const grandtotalDisplay = document.getElementById('grandtotal-display');
            const saveBillBtn = document.getElementById('save-bill-btn');
            const cancelBillBtn = document.getElementById('cancel-bill-btn');

            let allBills = [];
            let allCustomers = [];

            // --- DATA MANAGEMENT ---
            const getData = (key) => JSON.parse(localStorage.getItem(key) || '[]');
            const saveData = (key, data) => localStorage.setItem(key, JSON.stringify(data));
            
            // --- UI RENDERING & FILTERING ---
            const renderTable = (billsToRender) => {
                tableBody.innerHTML = '';
                if (billsToRender.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" class="empty-state">No bills found.</td></tr>`;
                    return;
                }
                const today = new Date(); today.setHours(0,0,0,0);
                billsToRender.forEach(bill => {
                    const customer = allCustomers.find(c => c.id === bill.customerId);
                    let status = bill.status;
                    if (status === 'Unpaid' && new Date(bill.dueDate) < today) status = 'Overdue';
                    const statusClass = status.toLowerCase();
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td data-label="Customer Name">${customer ? customer.name : 'N/A'}</td>
                        <td data-label="Bill #">${bill.billNumber}</td>
                        <td data-label="Amount">${bill.amount.toLocaleString('en-US', { style: 'currency', currency: 'JMD' })}</td>
                        <td data-label="Due Date">${new Date(bill.dueDate).toLocaleDateString('en-CA')}</td>
                        <td data-label="Status"><span class="chip chip-${statusClass}">${status}</span></td>
                        <td class="actions-cell">
                            <button class="btn btn-icon view" data-id="${bill.id}" title="View/Edit Bill">
                                <span class="material-symbols-outlined">visibility</span>
                            </button>
                        </td>`;
                    tableBody.appendChild(row);
                });
            };

            const applyFilters = () => {
                const searchTerm = searchInput.value.toLowerCase();
                const selectedStatus = statusFilter.value;
                const dateFrom = dateFromInput.value ? new Date(dateFromInput.value) : null;
                const dateTo = dateToInput.value ? new Date(dateToInput.value) : null;
                if(dateFrom) dateFrom.setHours(0,0,0,0);
                if(dateTo) dateTo.setHours(0,0,0,0);
                const today = new Date(); today.setHours(0,0,0,0);

                const filtered = allBills.filter(bill => {
                    const customer = allCustomers.find(c => c.id === bill.customerId);
                    const searchMatch = !searchTerm || (customer && customer.name.toLowerCase().includes(searchTerm)) || bill.billNumber.toLowerCase().includes(searchTerm);
                    let status = bill.status;
                    if (status === 'Unpaid' && new Date(bill.dueDate) < today) status = 'Overdue';
                    const statusMatch = selectedStatus === 'All' || status === selectedStatus;
                    const billDueDate = new Date(bill.dueDate); billDueDate.setHours(0,0,0,0);
                    const dateMatch = (!dateFrom || billDueDate >= dateFrom) && (!dateTo || billDueDate <= dateTo);
                    return searchMatch && statusMatch && dateMatch;
                });
                renderTable(filtered);
            };
            
            // --- BILL DIALOG (Screen 4.2) LOGIC ---
            const openDialog = (el) => el.classList.add('visible');
            const closeDialog = (el) => el.classList.remove('visible');

            const addLineItemRow = (item = { description: '', quantity: 1, unitPrice: 0 }) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><input type="text" class="line-description" value="${item.description}" placeholder="Service or Product" required></td>
                    <td style="width: 100px;"><input type="number" class="line-quantity" value="${item.quantity}" min="1" required></td>
                    <td style="width: 150px;"><input type="number" class="line-unitPrice" value="${item.unitPrice}" step="0.01" min="0" required></td>
                    <td class="actions-cell">
                        <button type="button" class="btn btn-icon delete line-delete-btn" title="Remove Item">
                             <span class="material-symbols-outlined">delete</span>
                        </button>
                    </td>`;
                lineItemsBody.appendChild(row);
            };

            const calculateTotals = () => {
                let subtotal = 0;
                lineItemsBody.querySelectorAll('tr').forEach(row => {
                    const quantity = parseFloat(row.querySelector('.line-quantity').value) || 0;
                    const unitPrice = parseFloat(row.querySelector('.line-unitPrice').value) || 0;
                    subtotal += quantity * unitPrice;
                });
                const format = (val) => val.toLocaleString('en-US', { style: 'currency', currency: 'JMD' });
                subtotalDisplay.textContent = format(subtotal);
                grandtotalDisplay.textContent = format(subtotal);
                saveBillBtn.disabled = subtotal <= 0;
            };
            
            const openBillDialog = (billId = null) => {
                billForm.reset();
                lineItemsBody.innerHTML = '';
                const bill = billId ? allBills.find(b => b.id === billId) : null;

                if (bill) {
                    billDialogTitle.textContent = `Edit Bill #${bill.billNumber}`;
                    billIdInput.value = bill.id;
                    const customer = allCustomers.find(c => c.id === bill.customerId);
                    if (customer) {
                        customerSearchInput.value = customer.name;
                        selectedCustomerIdInput.value = customer.id;
                    }
                    document.getElementById('bill-number').value = bill.billNumber;
                    document.getElementById('bill-date').value = bill.billDate || new Date().toISOString().split('T')[0];
                    document.getElementById('bill-dueDate').value = bill.dueDate;
                    (bill.lineItems && bill.lineItems.length > 0 ? bill.lineItems : [{ description: 'Service Charge', quantity: 1, unitPrice: bill.amount }]).forEach(addLineItemRow);
                } else {
                    billDialogTitle.textContent = 'Create New Bill';
                    billIdInput.value = '';
                    selectedCustomerIdInput.value = '';
                    addLineItemRow();
                    document.getElementById('bill-date').value = new Date().toISOString().split('T')[0];
                }
                calculateTotals();
                openDialog(billDialog);
            };
            
            const setupAutocomplete = () => {
                customerSearchInput.addEventListener("input", function() {
                    const val = this.value;
                    closeAllLists();
                    if (!val) { selectedCustomerIdInput.value = ''; return; }
                    const list = document.createElement("DIV");
                    list.setAttribute("class", "autocomplete-items");
                    this.parentNode.appendChild(list);
                    
                    allCustomers.filter(c => c.name.toUpperCase().includes(val.toUpperCase())).forEach(customer => {
                        const item = document.createElement("DIV");
                        item.innerHTML = `<strong>${customer.name.substr(0, val.length)}</strong>${customer.name.substr(val.length)}`;
                        item.addEventListener("click", function() {
                            customerSearchInput.value = customer.name;
                            selectedCustomerIdInput.value = customer.id;
                            closeAllLists();
                        });
                        list.appendChild(item);
                    });
                });
                 function closeAllLists() {
                    document.querySelectorAll(".autocomplete-items").forEach(item => item.parentNode.removeChild(item));
                }
                document.addEventListener("click", (e) => { if (e.target !== customerSearchInput) closeAllLists(); });
            };

            // --- EVENT LISTENERS ---
            [searchInput, statusFilter, dateFromInput, dateToInput].forEach(el => el.addEventListener('change', applyFilters));
            createBillBtn.addEventListener('click', () => openBillDialog());
            
            cancelBillBtn.addEventListener('click', () => closeDialog(billDialog));
            addLineItemBtn.addEventListener('click', () => addLineItemRow());
            lineItemsBody.addEventListener('input', calculateTotals);
            lineItemsBody.addEventListener('click', e => {
                if (e.target.closest('.line-delete-btn')) {
                    if (lineItemsBody.children.length > 1) {
                         e.target.closest('tr').remove();
                         calculateTotals();
                    } else {
                        alert('A bill must have at least one line item.');
                    }
                }
            });

            billForm.addEventListener('submit', e => {
                e.preventDefault();
                if (!selectedCustomerIdInput.value || lineItemsBody.children.length === 0) {
                    alert("Please select a customer and add at least one line item.");
                    return;
                }
                
                const lineItems = Array.from(lineItemsBody.querySelectorAll('tr')).map(row => ({
                    description: row.querySelector('.line-description').value,
                    quantity: parseFloat(row.querySelector('.line-quantity').value),
                    unitPrice: parseFloat(row.querySelector('.line-unitPrice').value)
                }));
                const grandTotal = lineItems.reduce((sum, item) => sum + (item.quantity * item.unitPrice), 0);

                const billData = {
                    id: billIdInput.value || 'b' + Date.now(),
                    customerId: selectedCustomerIdInput.value,
                    billNumber: document.getElementById('bill-number').value,
                    billDate: document.getElementById('bill-date').value,
                    dueDate: document.getElementById('bill-dueDate').value,
                    amount: grandTotal,
                    lineItems: lineItems,
                    status: 'Unpaid'
                };
                
                if (billIdInput.value) {
                    const index = allBills.findIndex(b => b.id === billIdInput.value);
                    allBills[index] = billData;
                } else {
                    allBills.push(billData);
                }
                saveData(BILL_KEY, allBills);
                applyFilters();
                closeDialog(billDialog);
            });
            
            tableBody.addEventListener('click', e => {
                const viewBtn = e.target.closest('button.view');
                if (viewBtn) openBillDialog(viewBtn.dataset.id);
            });
            
            // --- INITIALIZATION ---
            const initializeApp = () => {
                allCustomers = getData(CUSTOMER_KEY);
                allBills = getData(BILL_KEY);
                applyFilters();
                setupAutocomplete();
            };
            initializeApp();
        });
    </script>
        <script>
        fetch("header.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("header-placeholder").innerHTML = html;

                // 🟢 NOW that header is injected, attach dropdown toggle
                document.addEventListener('click', function (e) {
                    const isDropdownBtn = e.target.closest('.dropdown-button');
                    const dropdowns = document.querySelectorAll('.dropdown');

                    dropdowns.forEach(drop => {
                        if (drop.contains(e.target)) {
                            if (isDropdownBtn) {
                                drop.classList.toggle('open');
                            }
                        } else {
                            drop.classList.remove('open');
                        }
                    });
                });
            });
    </script>
    
</body>
</html>
