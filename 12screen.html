<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill & Payment Management</title>
    
    <!-- Fonts and Icons from Google CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <style>
        /* ------------------------- */
        /* --- DESIGN SYSTEM & SETUP --- */
        /* ------------------------- */
        :root {
            /* Branding Colors */
            --primary-color: #007a3d;
            --text-primary-color: #212121;
            --text-secondary-color: #6b6b6b;
            --background-color: #ffffff;
            --body-bg-color: #f7f7f7;
            --border-color: #eeeeee;
            --warning-color: #d32f2f;
            
            /* Status Chip Colors */
            --status-paid-bg: #e8f5e9; --status-paid-text: #2e7d32;
            --status-unpaid-bg: #e3f2fd; --status-unpaid-text: #0d47a1;
            --status-overdue-bg: #ffebee; --status-overdue-text: var(--warning-color);
            --status-cancelled-bg: #f5f5f5; --status-cancelled-text: #616161;

            /* Typography */
            --font-family-primary: 'Poppins', sans-serif;
            --font-family-secondary: 'Open Sans', sans-serif;
            --h3-font-size: 28px;
            --body-font-size: 16px;

            /* Layout & Components */
            --max-width: 1200px;
            --card-border-radius: 8px;
            --card-box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            --card-padding: 24px;
            --button-border-radius: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-family-secondary);
            background-color: var(--body-bg-color);
            color: var(--text-primary-color);
            line-height: 1.6;
            font-size: var(--body-font-size);
            padding: 32px 16px;
        }
        
        /* ------------------------- */
        /* --- MAIN LAYOUT & CARD --- */
        /* ------------------------- */
        .main-container {
            max-width: var(--max-width);
            margin: 0 auto;
            background: var(--background-color);
            border-radius: var(--card-border-radius);
            box-shadow: var(--card-box-shadow);
            padding: var(--card-padding);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .card-header h3 {
            font-family: var(--font-family-primary);
            font-size: var(--h3-font-size);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-header h3 .material-symbols-outlined {
            color: var(--primary-color);
            font-size: 32px;
        }
        
        .header-actions {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        /* ------------------------- */
        /* --- BUTTONS & CHIPS --- */
        /* ------------------------- */
        .btn {
            border: none; border-radius: var(--button-border-radius); padding: 12px 24px;
            font-family: var(--font-family-secondary); font-weight: 600; font-size: 16px;
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; transition: opacity 0.3s; text-decoration: none;
        }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background-color: var(--primary-color); color: var(--background-color); }
        .btn-stroked { background-color: transparent; color: var(--text-primary-color); border: 1px solid #ccc; }
        .btn-icon { background: none; padding: 8px; border-radius: 50%; line-height: 1; }
        .btn-icon:hover { background-color: rgba(0,0,0,0.05); }
        .btn-icon .material-symbols-outlined { color: var(--text-secondary-color); }
        .btn-icon.view .material-symbols-outlined { color: var(--primary-color); }

        .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 16px; font-size: 13px; font-weight: 600; }
        .chip-paid { background-color: var(--status-paid-bg); color: var(--status-paid-text); }
        .chip-unpaid { background-color: var(--status-unpaid-bg); color: var(--status-unpaid-text); }
        .chip-overdue { background-color: var(--status-overdue-bg); color: var(--status-overdue-text); }
        .chip-cancelled { background-color: var(--status-cancelled-bg); color: var(--status-cancelled-text); }
        
        /* ------------------------- */
        /* --- FILTERS --- */
        /* ------------------------- */
        .filters-container {
            padding: 16px;
            background-color: var(--body-bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--button-border-radius);
            margin-bottom: 24px;
        }
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            align-items: flex-end;
        }
        .form-field label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-secondary-color); font-size: 14px; }
        .form-field input, .form-field select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: var(--button-border-radius); font-size: var(--body-font-size); }
        .form-field input:focus, .form-field select:focus { outline: none; border-color: var(--primary-color); }
        
        /* ------------------------- */
        /* --- DATA TABLE --- */
        /* ------------------------- */
        .table-container { width: 100%; overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 16px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .data-table th { font-family: var(--font-family-primary); font-weight: 600; color: var(--text-secondary-color); font-size: 14px; text-transform: uppercase; }
        .data-table .actions-cell { text-align: right; }
        .empty-state { text-align: center; padding: 48px; color: var(--text-secondary-color); }

        /* ------------------------- */
        /* --- RESPONSIVENESS --- */
        /* ------------------------- */
        @media (max-width: 768px) {
            .data-table thead { display: none; }
            .data-table, .data-table tbody, .data-table tr, .data-table td { display: block; width: 100%; }
            .data-table tr { margin-bottom: 16px; border: 1px solid var(--border-color); border-radius: var(--card-border-radius); padding: 16px; }
            .data-table td { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border: none; text-align: right; }
            .data-table td::before { content: attr(data-label); font-weight: 600; color: var(--text-secondary-color); text-align: left; padding-right: 16px; }
            .data-table .actions-cell { justify-content: flex-end; }
            .data-table .actions-cell::before { display: none; }
        }
    </style>
</head>
<body>
<div id="header-placeholder"></div>
    <main class="main-container">
        <header class="card-header">
            <h3>
                <span class="material-symbols-outlined">receipt_long</span>
                Bill & Payment Management
            </h3>
            <div class="header-actions">
                <button id="import-bills-btn" class="btn btn-stroked">
                    <span class="material-symbols-outlined">upload_file</span>
                    Import Bills
                </button>
                <button id="create-bill-btn" class="btn btn-primary">
                    <span class="material-symbols-outlined">post_add</span>
                    Create New Bill
                </button>
            </div>
        </header>

        <section class="filters-container">
            <div class="filter-grid">
                <div class="form-field">
                    <label for="search-input">Search by Customer / Bill #</label>
                    <input type="text" id="search-input">
                </div>
                 <div class="form-field">
                    <label for="status-filter">Filter by Status</label>
                    <select id="status-filter">
                        <option value="All">All</option>
                        <option value="Unpaid">Unpaid</option>
                        <option value="Paid">Paid</option>
                        <option value="Overdue">Overdue</option>
                        <option value="Cancelled">Cancelled</option>
                    </select>
                </div>
                 <div class="form-field">
                    <label for="date-from">Due Date From</label>
                    <input type="date" id="date-from">
                </div>
                 <div class="form-field">
                    <label for="date-to">Due Date To</label>
                    <input type="date" id="date-to">
                </div>
            </div>
        </section>

        <section class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Customer Name</th>
                        <th>Bill #</th>
                        <th>Amount</th>
                        <th>Due Date</th>
                        <th>Status</th>
                        <th class="actions-cell">Actions</th>
                    </tr>
                </thead>
                <tbody id="bill-table-body">
                    <!-- JS will populate this -->
                </tbody>
            </table>
        </section>
    </main>

    <script>
        // --- HELPER FUNCTION FOR DEMO ---
        const createDummyDataForBiller = () => {
            const billerId = 'biller123';
            const customers = [
                { id: 'c1', billerId, name: 'John Doe' },
                { id: 'c2', billerId, name: 'Jane Smith' },
                { id: 'c3', billerId, name: 'Peter Jones' },
            ];
            localStorage.setItem('biller_customers', JSON.stringify(customers));
            
            const today = new Date();
            const bills = [
                { id: 'b101', billerId, customerId: 'c1', billNumber: 'INV-001', amount: 150.00, dueDate: new Date(today.getTime() + 10 * 86400000).toISOString().split('T')[0], status: 'Unpaid' },
                { id: 'b102', billerId, customerId: 'c2', billNumber: 'INV-002', amount: 75.50, dueDate: new Date(today.getTime() - 5 * 86400000).toISOString().split('T')[0], status: 'Unpaid' },
                { id: 'b103', billerId, customerId: 'c3', billNumber: 'INV-003', amount: 200.00, dueDate: new Date(today.getTime() - 2 * 86400000).toISOString().split('T')[0], status: 'Paid', paidDate: new Date().toISOString() },
                { id: 'b104', billerId, customerId: 'c1', billNumber: 'INV-004', amount: 50.25, dueDate: new Date(today.getTime() - 15 * 86400000).toISOString().split('T')[0], status: 'Unpaid' },
                { id: 'b105', billerId, customerId: 'c2', billNumber: 'INV-005', amount: 300.00, dueDate: new Date(today.getTime() + 30 * 86400000).toISOString().split('T')[0], status: 'Cancelled' },
            ];
            localStorage.setItem('biller_bills', JSON.stringify(bills));
            console.log("Dummy customer and bill data created. Please refresh.");
        };

        document.addEventListener('DOMContentLoaded', () => {
            // --- LOCALSTORAGE KEYS ---
            const CUSTOMER_KEY = 'biller_customers';
            const BILL_KEY = 'biller_bills';

            // --- DOM REFERENCES ---
            const searchInput = document.getElementById('search-input');
            const statusFilter = document.getElementById('status-filter');
            const dateFromInput = document.getElementById('date-from');
            const dateToInput = document.getElementById('date-to');
            const tableBody = document.getElementById('bill-table-body');
            const createBillBtn = document.getElementById('create-bill-btn');
            const importBillsBtn = document.getElementById('import-bills-btn');
            
            let allBills = [];
            let allCustomers = [];

            // --- DATA MANAGEMENT & SYNC ---
            const getData = (key) => JSON.parse(localStorage.getItem(key) || '[]');
            
            // --- UI RENDERING & FILTERING ---
            const renderTable = (billsToRender) => {
                tableBody.innerHTML = '';
                if (billsToRender.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" class="empty-state">No bills match the current filters.</td></tr>`;
                    return;
                }

                const today = new Date();
                today.setHours(0,0,0,0);

                billsToRender.forEach(bill => {
                    const customer = allCustomers.find(c => c.id === bill.customerId);
                    const customerName = customer ? customer.name : 'Unknown Customer';
                    
                    let effectiveStatus = bill.status;
                    if (bill.status === 'Unpaid' && new Date(bill.dueDate) < today) {
                        effectiveStatus = 'Overdue';
                    }
                    
                    const statusClass = effectiveStatus.toLowerCase();
                    const statusChip = `<span class="chip chip-${statusClass}">${effectiveStatus}</span>`;
                    
                    const formattedDate = new Date(bill.dueDate).toLocaleDateString('en-CA'); // YYYY-MM-DD format
                    const formattedAmount = bill.amount.toLocaleString('en-US', { style: 'currency', currency: 'JMD' });
                    
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td data-label="Customer Name">${customerName}</td>
                        <td data-label="Bill #">${bill.billNumber}</td>
                        <td data-label="Amount">${formattedAmount}</td>
                        <td data-label="Due Date">${formattedDate}</td>
                        <td data-label="Status">${statusChip}</td>
                        <td class="actions-cell">
                            <button class="btn btn-icon view" data-id="${bill.id}" title="View Details (Stub)">
                                <span class="material-symbols-outlined">visibility</span>
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            };

            const applyFilters = () => {
                const searchTerm = searchInput.value.toLowerCase();
                const selectedStatus = statusFilter.value;
                const dateFrom = dateFromInput.value ? new Date(dateFromInput.value) : null;
                const dateTo = dateToInput.value ? new Date(dateToInput.value) : null;

                if(dateFrom) dateFrom.setHours(0,0,0,0);
                if(dateTo) dateTo.setHours(0,0,0,0);

                const today = new Date();
                today.setHours(0,0,0,0);

                const filteredBills = allBills.filter(bill => {
                    const customer = allCustomers.find(c => c.id === bill.customerId);
                    const customerName = customer ? customer.name.toLowerCase() : '';
                    
                    // Search filter
                    const searchMatch = !searchTerm || customerName.includes(searchTerm) || bill.billNumber.toLowerCase().includes(searchTerm);

                    // Status filter
                    let effectiveStatus = bill.status;
                    if (bill.status === 'Unpaid' && new Date(bill.dueDate) < today) {
                        effectiveStatus = 'Overdue';
                    }
                    const statusMatch = selectedStatus === 'All' || effectiveStatus === selectedStatus;

                    // Date range filter
                    const billDueDate = new Date(bill.dueDate);
                    billDueDate.setHours(0,0,0,0);
                    const dateMatch = (!dateFrom || billDueDate >= dateFrom) && (!dateTo || billDueDate <= dateTo);
                    
                    return searchMatch && statusMatch && dateMatch;
                });
                renderTable(filteredBills);
            };

            // --- EVENT LISTENERS ---
            [searchInput, statusFilter, dateFromInput, dateToInput].forEach(el => {
                el.addEventListener('input', applyFilters);
                el.addEventListener('change', applyFilters);
            });

            createBillBtn.addEventListener('click', () => {window.location.href = '13screen.html'; });
            importBillsBtn.addEventListener('click', () => {window.location.href = '14screen.html'; });

            tableBody.addEventListener('click', e => {
                const viewBtn = e.target.closest('button.view');
                if (viewBtn) {
                    alert(`Viewing details for Bill ID: ${viewBtn.dataset.id} (Stub)`);
                }
            });

            // --- INITIALIZATION ---
            const initializeApp = () => {
                allCustomers = getData(CUSTOMER_KEY);
                allBills = getData(BILL_KEY);
                applyFilters(); // Initial render with all bills
            };

            initializeApp();
        });
    </script>
        <script>
        fetch("header.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("header-placeholder").innerHTML = html;

                // 🟢 NOW that header is injected, attach dropdown toggle
                document.addEventListener('click', function (e) {
                    const isDropdownBtn = e.target.closest('.dropdown-button');
                    const dropdowns = document.querySelectorAll('.dropdown');

                    dropdowns.forEach(drop => {
                        if (drop.contains(e.target)) {
                            if (isDropdownBtn) {
                                drop.classList.toggle('open');
                            }
                        } else {
                            drop.classList.remove('open');
                        }
                    });
                });
            });
    </script>
</body>
</html>
