<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biller Dashboard</title>
    
    <!-- Fonts and Icons from Google CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <style>
        /* ------------------------- */
        /* --- DESIGN SYSTEM & SETUP --- */
        /* ------------------------- */
        :root {
            /* Branding Colors */
            --primary-color: #007a3d;
            --secondary-color: #fdd835;
            --accent-color: #92278f;
            --text-primary-color: #212121;
            --text-secondary-color: #6b6b6b;
            --background-color: #ffffff;
            --body-bg-color: #f7f7f7;
            --border-color: #eeeeee;
            --warning-color: #d32f2f;

            /* Typography */
            --font-family-primary: 'Poppins', sans-serif;
            --font-family-secondary: 'Open Sans', sans-serif;
            --h2-font-size: 36px;
            --h3-font-size: 28px;
            --h4-font-size: 22px;
            --h6-font-size: 16px;
            --body-font-size: 16px;

            /* Layout & Components */
            --max-width: 1200px;
            --card-border-radius: 8px;
            --card-box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            --card-padding: 24px;
            --button-border-radius: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-family-secondary);
            background-color: var(--body-bg-color);
            color: var(--text-primary-color);
            line-height: 1.6;
            font-size: var(--body-font-size);
            padding: 32px 16px;
        }
        
        /* ------------------------- */
        /* --- MATERIAL ICONS --- */
        /* ------------------------- */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
            vertical-align: middle;
            line-height: 1;
        }

        /* ------------------------- */
        /* --- MAIN LAYOUT & DASHBOARD GRID --- */
        /* ------------------------- */
        .main-container {
            max-width: var(--max-width);
            margin: 0 auto;
        }
        .page-header {
            font-family: var(--font-family-primary);
            font-size: var(--h3-font-size);
            font-weight: 700;
            margin-bottom: 24px;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }
        .grid-span-2 {
             grid-column: span 2;
        }
        @media (max-width: 960px) {
            .grid-span-2 { grid-column: span 1; }
        }

        /* ------------------------- */
        /* --- CARDS --- */
        /* ------------------------- */
        .card {
            background: var(--background-color);
            border-radius: var(--card-border-radius);
            box-shadow: var(--card-box-shadow);
            padding: var(--card-padding);
        }

        /* KPI Card */
        .kpi-card {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .kpi-card .icon {
            color: var(--primary-color);
        }
         .kpi-card.warning .icon {
            color: var(--warning-color);
        }
        .kpi-card .text .title {
            font-size: var(--h6-font-size);
            font-weight: 600;
            color: var(--text-secondary-color);
        }
        .kpi-card .text .value {
            font-family: var(--font-family-primary);
            font-size: var(--h2-font-size);
            font-weight: 700;
        }

        /* Quick Actions Card */
        .actions-card .card-title {
            font-family: var(--font-family-primary);
            font-size: var(--h4-font-size);
            font-weight: 700;
            margin-bottom: 16px;
        }
        .actions-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .action-button {
            border: 1px solid var(--border-color);
            border-radius: var(--button-border-radius);
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: transparent;
            width: 100%;
            transition: background-color 0.2s;
        }
        .action-button:hover {
            background-color: #f9f9f9;
        }
        .action-button .material-symbols-outlined {
            font-size: 24px;
            color: var(--primary-color);
        }

        /* Recent Activity Card */
        .activity-card .card-title {
            font-family: var(--font-family-primary);
            font-size: var(--h4-font-size);
            font-weight: 700;
            margin-bottom: 16px;
        }
        .activity-list {
            list-style: none;
        }
        .activity-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .activity-list li:last-child {
            border-bottom: none;
        }
        .activity-item .icon {
            color: var(--text-secondary-color);
            font-size: 28px;
        }
        .activity-item .details .message {
            font-weight: 600;
        }
        .activity-item .details .timestamp {
            font-size: 13px;
            color: var(--text-secondary-color);
        }
        .empty-activity {
            text-align: center;
            padding: 24px;
            color: var(--text-secondary-color);
        }

    </style>
</head>
<body>

    <main class="main-container">
        <h3 class="page-header" id="welcome-header">Welcome, Biller Name</h3>

        <div class="dashboard-grid">
            <!-- KPI Cards -->
            <div class="card kpi-card">
                <span class="icon material-symbols-outlined">account_balance_wallet</span>
                <div class="text">
                    <div class="title">Total Outstanding</div>
                    <div class="value" id="kpi-outstanding">$0.00</div>
                </div>
            </div>

            <div class="card kpi-card warning">
                <span class="icon material-symbols-outlined">error_outline</span>
                <div class="text">
                    <div class="title">Total Overdue</div>
                    <div class="value" id="kpi-overdue">$0.00</div>
                </div>
            </div>

            <div class="card kpi-card">
                <span class="icon material-symbols-outlined">groups</span>
                <div class="text">
                    <div class="title">Active Customers</div>
                    <div class="value" id="kpi-customers">0</div>
                </div>
            </div>
            
            <div class="card kpi-card">
                <span class="icon material-symbols-outlined">paid</span>
                <div class="text">
                    <div class="title">Payments This Month</div>
                    <div class="value" id="kpi-payments">$0.00</div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="card actions-card">
                <h4 class="card-title">Quick Actions</h4>
                <div class="actions-container">
                    <button class="action-button" id="add-customer-btn">
                        <span class="material-symbols-outlined">person_add</span> Add New Customer
                    </button>
                    <button class="action-button" id="create-bill-btn">
                        <span class="material-symbols-outlined">post_add</span> Create a New Bill
                    </button>
                    <button class="action-button" id="import-bills-btn">
                        <span class="material-symbols-outlined">upload_file</span> Import Bills
                    </button>
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="card activity-card grid-span-2">
                <h4 class="card-title">Recent Activity</h4>
                <ul class="activity-list" id="activity-list">
                    <!-- JS will populate this -->
                </ul>
            </div>
        </div>
    </main>

    <script>
        // --- HELPER FUNCTION FOR DEMO ---
        // You can run this function from the browser console to create dummy data
        const createDummyDataForDashboard = () => {
            const billerId = 'biller123'; // Assume this is the logged-in biller
            
            // Dummy Customers
            const customers = [
                { id: 'c1', billerId, name: 'John Doe', email: 'john@email.com', accountId: 'JD-001' },
                { id: 'c2', billerId, name: 'Jane Smith', email: 'jane@email.com', accountId: 'JS-002' },
                { id: 'c3', billerId, name: 'Peter Jones', email: 'peter@email.com', accountId: 'PJ-003' },
            ];
            localStorage.setItem('biller_customers', JSON.stringify(customers));
            
            // Dummy Bills
            const today = new Date();
            const bills = [
                // Unpaid, not overdue
                { id: 'b1', billerId, customerId: 'c1', amount: 150.00, dueDate: new Date(today.getTime() + 10 * 24 * 60 * 60 * 1000).toISOString().split('T')[0], status: 'Unpaid' },
                // Unpaid and Overdue
                { id: 'b2', billerId, customerId: 'c2', amount: 75.50, dueDate: new Date(today.getTime() - 5 * 24 * 60 * 60 * 1000).toISOString().split('T')[0], status: 'Unpaid' },
                // Paid this month
                { id: 'b3', billerId, customerId: 'c3', amount: 200.00, dueDate: new Date().toISOString().split('T')[0], status: 'Paid', paidDate: new Date().toISOString() },
                 // Another overdue
                { id: 'b4', billerId, customerId: 'c1', amount: 50.25, dueDate: new Date(today.getTime() - 15 * 24 * 60 * 60 * 1000).toISOString().split('T')[0], status: 'Unpaid' },
            ];
            localStorage.setItem('biller_bills', JSON.stringify(bills));

             // Dummy Activity
            const activity = [
                { icon: 'receipt_long', message: 'Payment of $200.00 received from Peter Jones', timestamp: new Date().toISOString() },
                { icon: 'person_add', message: 'New customer Peter Jones was added', timestamp: new Date(today.getTime() - 1 * 24 * 60 * 60 * 1000).toISOString() },
                { icon: 'post_add', message: 'Bill #1024 for $75.50 created for Jane Smith', timestamp: new Date(today.getTime() - 2 * 24 * 60 * 60 * 1000).toISOString() }
            ];
             localStorage.setItem('biller_activity', JSON.stringify(activity));

            console.log("Dummy data created. Please refresh the page.");
        };

        document.addEventListener('DOMContentLoaded', () => {

            // --- LOCALSTORAGE KEYS ---
            const CUSTOMER_KEY = 'biller_customers';
            const BILL_KEY = 'biller_bills';
            const ACTIVITY_KEY = 'biller_activity';

            // --- DOM REFERENCES ---
            const kpiOutstanding = document.getElementById('kpi-outstanding');
            const kpiOverdue = document.getElementById('kpi-overdue');
            const kpiCustomers = document.getElementById('kpi-customers');
            const kpiPayments = document.getElementById('kpi-payments');
            const activityList = document.getElementById('activity-list');
            
            // Button references
            const addCustomerBtn = document.getElementById('add-customer-btn');
            const createBillBtn = document.getElementById('create-bill-btn');
            const importBillsBtn = document.getElementById('import-bills-btn');
            
            // Assume the logged-in biller's name is available
            const billerName = "My Awesome Business";
            document.getElementById('welcome-header').textContent = `Welcome, ${billerName}`;
            
            // --- DATA LOADING & CALCULATION ---
            const loadData = () => {
                const customers = JSON.parse(localStorage.getItem(CUSTOMER_KEY) || '[]');
                const bills = JSON.parse(localStorage.getItem(BILL_KEY) || '[]');
                const activity = JSON.parse(localStorage.getItem(ACTIVITY_KEY) || '[]');
                return { customers, bills, activity };
            };

            const calculateKPIs = (customers, bills) => {
                const today = new Date();
                today.setHours(0,0,0,0);
                
                // Total Outstanding
                const outstanding = bills
                    .filter(b => b.status === 'Unpaid')
                    .reduce((sum, b) => sum + b.amount, 0);
                
                // Total Overdue
                const overdue = bills
                    .filter(b => b.status === 'Unpaid' && new Date(b.dueDate) < today)
                    .reduce((sum, b) => sum + b.amount, 0);

                // Payments this month
                const startOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);
                const paymentsThisMonth = bills
                    .filter(b => b.status === 'Paid' && new Date(b.paidDate) >= startOfMonth)
                    .reduce((sum, b) => sum + b.amount, 0);

                // Active Customers
                const activeCustomers = customers.length;
                
                return { outstanding, overdue, paymentsThisMonth, activeCustomers };
            };

            const formatCurrency = (amount) => {
                return amount.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
            };

            // --- UI RENDERING ---
            const renderDashboard = () => {
                const { customers, bills, activity } = loadData();
                const kpis = calculateKPIs(customers, bills);

                // Update KPI Cards
                kpiOutstanding.textContent = formatCurrency(kpis.outstanding);
                kpiOverdue.textContent = formatCurrency(kpis.overdue);
                kpiCustomers.textContent = kpis.activeCustomers;
                kpiPayments.textContent = formatCurrency(kpis.paymentsThisMonth);

                // Update Activity List
                activityList.innerHTML = '';
                if (activity.length === 0) {
                    activityList.innerHTML = `<li class="empty-activity">No recent activity.</li>`;
                    return;
                }

                const sortedActivity = activity.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
                sortedActivity.slice(0, 5).forEach(item => { // Show latest 5 activities
                    const li = document.createElement('li');
                    li.className = 'activity-item';
                    const timeAgo = getTimeAgo(item.timestamp);
                    li.innerHTML = `
                        <span class="icon material-symbols-outlined">${item.icon}</span>
                        <div class="details">
                            <div class="message">${item.message}</div>
                            <div class="timestamp">${timeAgo}</div>
                        </div>
                    `;
                    activityList.appendChild(li);
                });
            };

            const getTimeAgo = (dateString) => {
                const date = new Date(dateString);
                const seconds = Math.floor((new Date() - date) / 1000);
                let interval = seconds / 31536000;
                if (interval > 1) return Math.floor(interval) + " years ago";
                interval = seconds / 2592000;
                if (interval > 1) return Math.floor(interval) + " months ago";
                interval = seconds / 86400;
                if (interval > 1) return Math.floor(interval) + " days ago";
                interval = seconds / 3600;
                if (interval > 1) return Math.floor(interval) + " hours ago";
                interval = seconds / 60;
                if (interval > 1) return Math.floor(interval) + " minutes ago";
                return "Just now";
            };
            
            // --- EVENT LISTENERS ---
            addCustomerBtn.addEventListener('click', () => alert('Navigating to Add Customer screen (Screen 3.3)...'));
            createBillBtn.addEventListener('click', () => alert('Navigating to Create Bill screen (Screen 4.2)...'));
            importBillsBtn.addEventListener('click', () => alert('Navigating to Import Bills screen (Screen 4.3)...'));
            
            // --- INITIALIZATION ---
            renderDashboard();

        });
    </script>
</body>
</html>
