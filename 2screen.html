<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permission Management</title>
    
    <!-- Fonts and Icons from Google CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <style>
        /* ------------------------- */
        /* --- DESIGN SYSTEM & SETUP --- */
        /* ------------------------- */
        :root {
            /* Branding Colors from Design.json */
            --primary-color: #007a3d;
            --secondary-color: #fdd835;
            --accent-color: #92278f;
            --text-primary-color: #212121;
            --text-secondary-color: #6b6b6b;
            --background-color: #ffffff;
            --warning-color: #f57c00;

            /* Typography */
            --font-family-primary: 'Poppins', sans-serif;
            --font-family-secondary: 'Open Sans', sans-serif;
            --h3-font-size: 28px;
            --body-font-size: 16px;

            /* Layout & Components */
            --max-width: 1200px;
            --card-border-radius: 8px;
            --card-box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            --card-padding: 24px;
            --button-border-radius: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family-secondary);
            background-color: #f7f7f7;
            color: var(--text-primary-color);
            line-height: 1.6;
            font-size: var(--body-font-size);
            padding: 32px 16px;
        }

        /* ------------------------- */
        /* --- MATERIAL ICONS --- */
        /* ------------------------- */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
            line-height: 1;
        }

        /* ------------------------- */
        /* --- MAIN CARD LAYOUT --- */
        /* ------------------------- */
        .main-container {
            max-width: var(--max-width);
            margin: 0 auto;
            background: var(--background-color);
            border-radius: var(--card-border-radius);
            box-shadow: var(--card-box-shadow);
            padding: var(--card-padding);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .card-header h3 {
            font-family: var(--font-family-primary);
            font-size: var(--h3-font-size);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-header h3 .material-symbols-outlined {
            color: var(--primary-color);
            font-size: 32px;
        }

        /* ------------------------- */
        /* --- BUTTONS --- */
        /* ------------------------- */
        .btn {
            border: none;
            border-radius: var(--button-border-radius);
            padding: 12px 24px;
            font-family: var(--font-family-secondary);
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.3s, box-shadow 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover {
            opacity: 0.9;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            color: var(--background-color);
        }

        .btn-secondary {
            background-color: #e0e0e0;
            color: var(--text-primary-color);
        }
        
        .btn-icon {
            background: none;
            padding: 8px;
            border-radius: 50%;
            line-height: 1;
        }
        .btn-icon:hover {
            background-color: rgba(0,0,0,0.05);
        }
        .btn-icon .material-symbols-outlined {
            color: var(--text-secondary-color);
        }
        .btn-icon.edit .material-symbols-outlined {
            color: var(--primary-color);
        }
        
        /* Tooltip */
        [title]:hover::after {
            content: attr(title);
            position: absolute;
            background: var(--text-primary-color);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            margin-top: 25px;
            margin-left: -20px;
        }

        /* ------------------------- */
        /* --- DATA TABLE --- */
        /* ------------------------- */
        .table-container {
            width: 100%;
            overflow-x: auto;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        .data-table th, .data-table td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #eeeeee;
        }
        .data-table th {
            font-family: var(--font-family-primary);
            font-weight: 600;
            color: var(--text-secondary-color);
            font-size: 14px;
            text-transform: uppercase;
        }
        .data-table td {
            color: var(--text-primary-color);
        }
        .data-table .actions-cell {
            text-align: right;
            white-space: nowrap;
        }
        .empty-state {
            text-align: center;
            padding: 48px;
            color: var(--text-secondary-color);
        }
        
        /* ------------------------- */
        /* --- DIALOG / MODAL --- */
        /* ------------------------- */
        .dialog-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .dialog-backdrop.visible {
            opacity: 1;
            visibility: visible;
        }

        .dialog-content {
            background: var(--background-color);
            border-radius: var(--card-border-radius);
            padding: var(--card-padding);
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transform: scale(0.9);
            transition: transform 0.3s;
        }
        .dialog-backdrop.visible .dialog-content {
            transform: scale(1);
        }

        .dialog-header {
            font-family: var(--font-family-primary);
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .dialog-body {
            margin-bottom: 24px;
        }
        .dialog-body p {
            color: var(--text-secondary-color);
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
        
        .dialog-content.delete-confirm .dialog-header {
             display: flex;
             align-items: center;
             gap: 16px;
        }
        .dialog-content.delete-confirm .material-symbols-outlined {
            color: var(--warning-color);
            font-size: 28px;
        }
        
        /* ------------------------- */
        /* --- FORM FIELDS --- */
        /* ------------------------- */
        .form-field {
            margin-bottom: 20px;
        }
        .form-field label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary-color);
            font-size: 14px;
        }
        .form-field input, .form-field select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: var(--button-border-radius);
            font-size: var(--body-font-size);
            font-family: var(--font-family-secondary);
            transition: border-color 0.3s;
            background-color: #fff;
        }
        .form-field input:focus, .form-field select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* ------------------------- */
        /* --- RESPONSIVENESS --- */
        /* ------------------------- */
        @media (max-width: 768px) {
            .data-table thead {
                display: none;
            }
            .data-table, .data-table tbody, .data-table tr {
                display: block;
                width: 100%;
            }
            .data-table tr {
                margin-bottom: 16px;
                border: 1px solid #eee;
                border-radius: var(--card-border-radius);
                padding: 16px;
            }
            .data-table td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 8px 0;
                border: none;
                text-align: right;
            }
            .data-table td::before {
                content: attr(data-label);
                font-weight: 600;
                color: var(--text-secondary-color);
                text-align: left;
                padding-right: 16px;
            }
            .data-table .actions-cell {
                justify-content: flex-end;
            }
            .data-table .actions-cell::before {
                display: none;
            }
        }
    </style>
</head>
<body>

    <main class="main-container">
        <header class="card-header">
            <h3>
                <span class="material-symbols-outlined">vpn_key</span>
                System Permission Management
            </h3>
            <button id="add-permission-btn" class="btn btn-primary">
                <span class="material-symbols-outlined">add</span>
                Add New Permission
            </button>
        </header>

        <section class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Display Name</th>
                        <th>Permission Key</th>
                        <th>Module</th>
                        <th class="actions-cell">Actions</th>
                    </tr>
                </thead>
                <tbody id="permission-table-body">
                    <!-- JS will populate this -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- Add/Edit Permission Dialog -->
    <div id="permission-dialog" class="dialog-backdrop">
        <div class="dialog-content">
            <h4 id="dialog-title" class="dialog-header">Add New Permission</h4>
            <div class="dialog-body">
                <form id="permission-form">
                    <input type="hidden" id="permission-id">
                    <div class="form-field">
                        <label for="permission-display-name">Display Name</label>
                        <input type="text" id="permission-display-name" required>
                    </div>
                    <div class="form-field">
                        <label for="permission-key">Permission Key</label>
                        <input type="text" id="permission-key" required placeholder="e.g., module.action">
                    </div>
                    <div class="form-field">
                        <label for="permission-description">Description</label>
                        <input type="text" id="permission-description" required>
                    </div>
                    <div class="form-field">
                        <label for="permission-module">Module</label>
                        <select id="permission-module" required>
                            <!-- JS will populate modules -->
                        </select>
                    </div>
                </form>
            </div>
            <div class="dialog-actions">
                <button id="cancel-btn" class="btn btn-secondary">Cancel</button>
                <button id="save-btn" type="submit" form="permission-form" class="btn btn-primary">Save</button>
            </div>
        </div>
    </div>
    
    <!-- Delete Confirmation Dialog -->
    <div id="delete-dialog" class="dialog-backdrop">
        <div class="dialog-content delete-confirm">
            <h4 class="dialog-header">
                 <span class="material-symbols-outlined">warning_amber</span>
                 Delete Permission
            </h4>
            <div class="dialog-body">
                <p>Are you sure you want to delete this permission? This is a critical action.</p>
            </div>
            <div class="dialog-actions">
                <button id="cancel-delete-btn" class="btn btn-secondary">Cancel</button>
                <button id="confirm-delete-btn" class="btn btn-primary">Delete</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // --- DOM ELEMENT REFERENCES ---
            const addPermissionBtn = document.getElementById('add-permission-btn');
            const tableBody = document.getElementById('permission-table-body');
            
            // Add/Edit Dialog
            const permissionDialog = document.getElementById('permission-dialog');
            const dialogTitle = document.getElementById('dialog-title');
            const permissionForm = document.getElementById('permission-form');
            const permissionIdInput = document.getElementById('permission-id');
            const permissionDisplayNameInput = document.getElementById('permission-display-name');
            const permissionKeyInput = document.getElementById('permission-key');
            const permissionDescriptionInput = document.getElementById('permission-description');
            const permissionModuleSelect = document.getElementById('permission-module');
            const cancelBtn = document.getElementById('cancel-btn');

            // Delete Dialog
            const deleteDialog = document.getElementById('delete-dialog');
            const cancelDeleteBtn = document.getElementById('cancel-delete-btn');
            const confirmDeleteBtn = document.getElementById('confirm-delete-btn');
            
            let permissions = [];
            let modules = [];
            let permissionToDeleteId = null;

            // --- DATA MANAGEMENT (localStorage) ---

            // Modules are needed for the dropdown. We simulate them being managed elsewhere.
            const getModules = () => {
                const storedModules = localStorage.getItem('modules');
                if (storedModules) {
                    return JSON.parse(storedModules);
                }
                // Pre-populate modules if none exist
                const defaultModules = [
                    { id: 'm1', name: 'Dashboard', description: 'The main dashboard view.', sortOrder: 1 },
                    { id: 'm2', name: 'User Management', description: 'Manage users and roles.', sortOrder: 2 },
                    { id: 'm3', name: 'Reporting', description: 'View and export reports.', sortOrder: 3 },
                    { id: 'm4', name: 'Biller Management', description: 'Onboard and manage billers.', sortOrder: 4 },
                ];
                localStorage.setItem('modules', JSON.stringify(defaultModules));
                return defaultModules;
            };

            const getPermissions = () => {
                const storedPermissions = localStorage.getItem('permissions');
                if (storedPermissions) {
                    return JSON.parse(storedPermissions);
                }
                 // Pre-populate permissions if none exist
                const defaultPermissions = [
                     { id: 'p1', displayName: 'View Users', key: 'user.view', description: 'Can view the list of users.', moduleId: 'm2' },
                     { id: 'p2', displayName: 'Create Users', key: 'user.create', description: 'Can create new users.', moduleId: 'm2' },
                     { id: 'p3', displayName: 'View Biller Reports', key: 'report.view.biller', description: 'Can view biller-specific reports.', moduleId: 'm3' }
                ];
                localStorage.setItem('permissions', JSON.stringify(defaultPermissions));
                return defaultPermissions;
            };

            const savePermissions = (data) => {
                localStorage.setItem('permissions', JSON.stringify(data));
            };

            // --- UI RENDERING & HELPERS ---
            const renderTable = () => {
                tableBody.innerHTML = '';
                if (permissions.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="4" class="empty-state">No permissions defined. Add one to get started.</td>
                        </tr>`;
                    return;
                }
                
                permissions.forEach(permission => {
                    const module = modules.find(m => m.id === permission.moduleId);
                    const moduleName = module ? module.name : 'N/A';
                    
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td data-label="Display Name">${permission.displayName}</td>
                        <td data-label="Permission Key">${permission.key}</td>
                        <td data-label="Module">${moduleName}</td>
                        <td class="actions-cell">
                            <button class="btn btn-icon edit" data-id="${permission.id}" title="Edit Permission">
                                <span class="material-symbols-outlined">edit</span>
                            </button>
                            <button class="btn btn-icon delete" data-id="${permission.id}" title="Delete Permission">
                                <span class="material-symbols-outlined">delete_outline</span>
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            };
            
            const populateModuleDropdown = (selectedModuleId = null) => {
                permissionModuleSelect.innerHTML = '<option value="" disabled selected>Select a module</option>';
                const sortedModules = [...modules].sort((a,b) => a.sortOrder - b.sortOrder);
                sortedModules.forEach(module => {
                    const option = document.createElement('option');
                    option.value = module.id;
                    option.textContent = module.name;
                    if(module.id === selectedModuleId) {
                        option.selected = true;
                    }
                    permissionModuleSelect.appendChild(option);
                });
            };

            // --- DIALOG MANAGEMENT ---
            const openDialog = (dialogElement) => dialogElement.classList.add('visible');
            const closeDialog = (dialogElement) => dialogElement.classList.remove('visible');

            const openAddDialog = () => {
                permissionForm.reset();
                permissionIdInput.value = '';
                dialogTitle.textContent = 'Add New Permission';
                populateModuleDropdown();
                openDialog(permissionDialog);
            };

            const openEditDialog = (id) => {
                const permission = permissions.find(p => p.id === id);
                if (permission) {
                    dialogTitle.textContent = 'Edit Permission';
                    permissionIdInput.value = permission.id;
                    permissionDisplayNameInput.value = permission.displayName;
                    permissionKeyInput.value = permission.key;
                    permissionDescriptionInput.value = permission.description;
                    populateModuleDropdown(permission.moduleId);
                    openDialog(permissionDialog);
                }
            };
            
            const openDeleteDialog = (id) => {
                permissionToDeleteId = id;
                openDialog(deleteDialog);
            };

            // --- EVENT LISTENERS ---
            addPermissionBtn.addEventListener('click', openAddDialog);
            cancelBtn.addEventListener('click', () => closeDialog(permissionDialog));
            permissionDialog.addEventListener('click', (e) => e.target === permissionDialog && closeDialog(permissionDialog));

            permissionForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const id = permissionIdInput.value;
                const permissionData = {
                    displayName: permissionDisplayNameInput.value,
                    key: permissionKeyInput.value,
                    description: permissionDescriptionInput.value,
                    moduleId: permissionModuleSelect.value,
                };

                if (id) { // Editing
                    const index = permissions.findIndex(p => p.id === id);
                    permissions[index] = { ...permissions[index], ...permissionData };
                } else { // Adding
                    permissionData.id = 'p' + Date.now();
                    permissions.push(permissionData);
                }

                savePermissions(permissions);
                renderTable();
                closeDialog(permissionDialog);
            });

            tableBody.addEventListener('click', (e) => {
                const editButton = e.target.closest('button.edit');
                const deleteButton = e.target.closest('button.delete');
                if (editButton) openEditDialog(editButton.dataset.id);
                if (deleteButton) openDeleteDialog(deleteButton.dataset.id);
            });

            cancelDeleteBtn.addEventListener('click', () => closeDialog(deleteDialog));
            deleteDialog.addEventListener('click', (e) => e.target === deleteDialog && closeDialog(deleteDialog));
            
            confirmDeleteBtn.addEventListener('click', () => {
                if (permissionToDeleteId) {
                    permissions = permissions.filter(p => p.id !== permissionToDeleteId);
                    savePermissions(permissions);
                    renderTable();
                    closeDialog(deleteDialog);
                    permissionToDeleteId = null;
                }
            });

            // --- INITIALIZATION ---
            const initializeApp = () => {
                modules = getModules();
                permissions = getPermissions();
                renderTable();
            };

            initializeApp();
        });
    </script>

</body>
</html>
